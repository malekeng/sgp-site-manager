<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>משתמשים | SGP</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.png">
<link rel="stylesheet" href="css/styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<header class="app-header" id="app-header"></header>

<main class="page">
  <h1 class="page-title">משתמשים</h1>

  <div class="card">
    <div class="card-header"><h2>בקשות גישה ממתינות</h2></div>
    <div id="requestsList"><div class="loading-overlay"><div class="spinner"></div></div></div>
  </div>

  <div class="card">
    <div class="card-header">
      <h2>משתמשי המערכת</h2>
      <button class="btn btn-primary" id="inviteBtn">+ הזמנת משתמש</button>
      <button class="btn btn-outline" id="addContractorBtn">+ קבלן חדש</button>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>שם מלא</th><th>שם משתמש</th><th>אימייל</th><th>תפקיד מערכת</th><th>תפקיד בשטח</th><th>אתר</th><th></th></tr></thead>
        <tbody id="usersBody">
          <tr class="empty-row"><td colspan="7"><div class="loading-overlay"><div class="spinner"></div></div></td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="card">
    <div class="card-header">
      <h2>ניהול אתרים</h2>
      <button class="btn btn-primary btn-sm" id="addSiteBtn">+ אתר חדש</button>
    </div>
    <div id="sitesMsg" class="msg"></div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>שם האתר</th></tr></thead>
        <tbody id="sitesBody">
          <tr class="empty-row"><td><div class="loading-overlay"><div class="spinner"></div></div></td></tr>
        </tbody>
      </table>
    </div>
  </div>
</main>

<!-- Invite modal -->
<div class="modal-backdrop" id="inviteModalBackdrop">
  <div class="modal">
    <h3>הזמנת משתמש חדש</h3>
    <div id="inviteMsg" class="msg"></div>
    <form id="inviteForm">
      <div class="form-grid">
        <div class="field full"><label>אימייל *</label><input type="email" name="email" required></div>
        <div class="field"><label>שם משתמש *</label><input type="text" name="username" required></div>
        <div class="field"><label>שם מלא</label><input type="text" name="full_name"></div>
        <div class="field">
          <label>תפקיד *</label>
          <select name="role" required id="roleSelect">
            <option value="site_user">משתמש אתר</option>
            <option value="admin">מנהל</option>
            <option value="owner">בעלים</option>
          </select>
        </div>
        <div class="field full" id="siteField">
          <label>אתרים (ניתן לבחור כמה)</label>
          <div class="site-check-list" id="siteCheckList"></div>
        </div>
      </div>
      <div class="modal-actions">
        <button type="submit" class="btn btn-primary" id="inviteSubmitBtn">שליחת הזמנה</button>
        <button type="button" class="btn btn-outline" id="cancelInviteBtn">ביטול</button>
      </div>
    </form>
  </div>
</div>

<!-- Contractor modal -->
<div class="modal-backdrop" id="contractorModalBackdrop">
  <div class="modal">
    <h3>קבלן חדש</h3>
    <p style="font-size:12.5px;color:var(--steel);margin-bottom:14px;">
      הקבלן יתחבר במסך נפרד (contractor-login.html) עם מספר טלפון וסיסמה, ויראה רק את המשימות המוטלות עליו.
    </p>
    <div id="contractorMsg" class="msg"></div>
    <form id="contractorForm">
      <div class="form-grid">
        <div class="field full"><label>שם מלא *</label><input type="text" name="full_name" required></div>
        <div class="field"><label>מספר טלפון *</label><input type="tel" name="phone" required placeholder="050-1234567"></div>
        <div class="field"><label>סיסמה *</label><input type="text" name="password" required minlength="6" placeholder="לפחות 6 תווים"></div>
        <div class="field full">
          <label>אתרים (ניתן לבחור כמה) *</label>
          <div class="site-check-list" id="contractorSiteCheckList"></div>
        </div>
      </div>
      <div class="modal-actions">
        <button type="submit" class="btn btn-primary" id="contractorSubmitBtn">יצירת קבלן</button>
        <button type="button" class="btn btn-outline" id="cancelContractorBtn">ביטול</button>
      </div>
    </form>
  </div>
</div>

<!-- Edit user modal -->
<div class="modal-backdrop" id="editModalBackdrop">
  <div class="modal">
    <h3>עריכת משתמש</h3>
    <div id="editMsg" class="msg"></div>
    <form id="editForm">
      <input type="hidden" name="id">
      <div class="form-grid">
        <div class="field full"><label>אימייל</label><input type="email" name="email" disabled style="opacity:0.6;"></div>
        <div class="field"><label>שם משתמש *</label><input type="text" name="username" required></div>
        <div class="field"><label>שם מלא</label><input type="text" name="full_name"></div>
        <div class="field">
          <label>תפקיד מערכת *</label>
          <select name="role" required id="editRoleSelect">
            <option value="site_user">משתמש אתר</option>
            <option value="admin">מנהל</option>
            <option value="owner">בעלים</option>
          </select>
        </div>
        <div class="field full">
          <label>תפקיד בשטח</label>
          <select name="job_title" id="editJobTitle">
            <option value="">— ללא —</option>
            <option value="מנהל עבודה">מנהל עבודה</option>
            <option value="מנהל פרויקט">מנהל פרויקט</option>
            <option value="מהנדס ביצוע">מהנדס ביצוע</option>
            <option value="מהנדס קונסטרוקציה">מהנדס קונסטרוקציה</option>
            <option value="מפקח">מפקח</option>
            <option value="מודד">מודד</option>
            <option value="קבלן">קבלן</option>
            <option value="מהנדס בטיחות">מהנדס בטיחות</option>
          </select>
        </div>
        <div class="field full" id="editSiteField">
          <label>אתרים (ניתן לבחור כמה)</label>
          <div class="site-check-list" id="editSiteCheckList"></div>
        </div>
      </div>
      <div class="modal-actions">
        <button type="submit" class="btn btn-primary" id="editSubmitBtn">שמירה</button>
        <button type="button" class="btn btn-outline" id="cancelEditBtn">ביטול</button>
      </div>
    </form>
  </div>
</div>

<!-- Add site modal -->
<div class="modal-backdrop" id="siteModalBackdrop">
  <div class="modal">
    <h3>אתר חדש</h3>
    <div id="siteFormMsg" class="msg"></div>
    <form id="siteForm">
      <div class="field full"><label>שם האתר *</label><input type="text" name="name" required></div>
      <div class="modal-actions">
        <button type="submit" class="btn btn-primary">יצירה</button>
        <button type="button" class="btn btn-outline" id="cancelSiteBtn">ביטול</button>
      </div>
    </form>
  </div>
</div>

<script src="js/supabase-client.js"></script>
<script src="js/app.js"></script>
<script>
(async function () {
  const auth = await requireAuth('users.html');
  if (!auth) return;
  const { user, profile } = auth;

  if (profile.role !== 'owner' && profile.role !== 'admin') {
    document.querySelector('main.page').innerHTML = '<p>אין לך הרשאה לצפות בעמוד זה.</p>';
    return;
  }

  const isOwner = profile.role === 'owner';
  const roleLabels = { owner: 'בעלים', admin: 'מנהל', site_user: 'משתמש אתר', contractor: 'קבלן' };
  let usersCache = [];
  let sitesCache = [];

  async function loadUsers() {
    const { data, error } = await sb.from('profiles')
      .select('*, sites!profiles_site_id_fkey(name), profile_sites(site_id, sites(name))')
      .order('created_at', { ascending: true });
    const body = document.getElementById('usersBody');
    if (error) { body.innerHTML = `<tr class="empty-row"><td colspan="7">שגיאה: ${error.message}</td></tr>`; return; }
    usersCache = data || [];
    body.innerHTML = usersCache.map(u => {
      const siteNames = u.role === 'owner'
        ? 'כל האתרים'
        : ((u.profile_sites || []).map(ps => ps.sites?.name).filter(Boolean).join(', ') || '—');
      return `
      <tr>
        <td>${u.full_name || '—'}</td>
        <td>${u.username}</td>
        <td>${u.email}</td>
        <td>${roleLabels[u.role] || u.role}</td>
        <td>${u.job_title || '—'}</td>
        <td>${siteNames}</td>
        <td class="row-actions">
          <div class="row-actions-inner">
            ${isOwner ? `
              <button class="icon-btn" data-edit-user="${u.id}" title="עריכה">✏️</button>
              ${u.role !== 'contractor' ? `<button class="icon-btn" data-resend="${u.id}" title="שליחת הזמנה מחדש">📧</button>` : ''}
              ${u.id !== user.id ? `<button class="icon-btn danger" data-del-user="${u.id}" title="מחיקה">🗑️</button>` : ''}
            ` : ''}
          </div>
        </td>
      </tr>
    `;
    }).join('');

    body.querySelectorAll('[data-edit-user]').forEach(b => b.addEventListener('click', () => openEdit(b.dataset.editUser)));
    body.querySelectorAll('[data-resend]').forEach(b => b.addEventListener('click', () => resendInvite(b.dataset.resend)));
    body.querySelectorAll('[data-del-user]').forEach(b => b.addEventListener('click', () => deleteUser(b.dataset.delUser)));
  }

  function renderSiteChecks(containerId, selectedIds) {
    const host = document.getElementById(containerId);
    host.innerHTML = sitesCache.map(s => `
      <label class="site-check ${selectedIds.includes(s.id) ? 'checked' : ''}">
        <input type="checkbox" name="site_ids" value="${s.id}" ${selectedIds.includes(s.id) ? 'checked' : ''}>
        ${s.name}
      </label>
    `).join('');
    host.querySelectorAll('.site-check').forEach(label => {
      const cb = label.querySelector('input');
      cb.addEventListener('change', () => label.classList.toggle('checked', cb.checked));
    });
  }

  let approvingRequestId = null;

  document.getElementById('roleSelect').addEventListener('change', e => {
    document.getElementById('siteField').style.display = e.target.value === 'owner' ? 'none' : 'flex';
  });

  function openInviteModal(prefill) {
    document.getElementById('inviteForm').reset();
    hideMsg(document.getElementById('inviteMsg'));
    renderSiteChecks('siteCheckList', []);
    document.getElementById('siteField').style.display = 'flex';
    approvingRequestId = prefill?.requestId || null;
    if (prefill) {
      document.getElementById('inviteForm').email.value = prefill.email || '';
      document.getElementById('inviteForm').full_name.value = prefill.full_name || '';
      document.getElementById('inviteForm').username.value = (prefill.email || '').split('@')[0] || '';
    }
    document.getElementById('inviteModalBackdrop').classList.add('open');
  }

  document.getElementById('inviteBtn').addEventListener('click', () => openInviteModal(null));

  // ===== Contractors =====
  document.getElementById('addContractorBtn').addEventListener('click', () => {
    document.getElementById('contractorForm').reset();
    hideMsg(document.getElementById('contractorMsg'));
    renderSiteChecks('contractorSiteCheckList', []);
    document.getElementById('contractorModalBackdrop').classList.add('open');
  });
  document.getElementById('cancelContractorBtn').addEventListener('click', () => document.getElementById('contractorModalBackdrop').classList.remove('open'));
  document.getElementById('contractorModalBackdrop').addEventListener('click', e => {
    if (e.target.id === 'contractorModalBackdrop') e.target.classList.remove('open');
  });

  document.getElementById('contractorForm').addEventListener('submit', async e => {
    e.preventDefault();
    const msgEl = document.getElementById('contractorMsg');
    hideMsg(msgEl);
    const btn = document.getElementById('contractorSubmitBtn');
    btn.disabled = true;

    const fd = new FormData(e.target);
    const siteIds = fd.getAll('site_ids');
    if (!siteIds.length) {
      showMsg(msgEl, 'יש לבחור לפחות אתר אחד', 'error');
      btn.disabled = false;
      return;
    }
    const payload = {
      full_name: fd.get('full_name'),
      phone: fd.get('phone'),
      password: fd.get('password'),
      site_ids: siteIds,
    };

    const { data: { session } } = await sb.auth.getSession();
    try {
      const res = await fetch('https://odsxjatgebpwphzbevpu.supabase.co/functions/v1/create-contractor', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${session.access_token}` },
        body: JSON.stringify(payload),
      });
      const result = await res.json();
      if (!res.ok) throw new Error(result.error || 'שגיאה לא ידועה');

      toast('הקבלן נוצר בהצלחה', 'success');
      document.getElementById('contractorModalBackdrop').classList.remove('open');
      loadUsers();
    } catch (err) {
      showMsg(msgEl, 'שגיאה: ' + err.message, 'error');
    } finally {
      btn.disabled = false;
    }
  });
  document.getElementById('cancelInviteBtn').addEventListener('click', () => document.getElementById('inviteModalBackdrop').classList.remove('open'));
  document.getElementById('inviteModalBackdrop').addEventListener('click', e => {
    if (e.target.id === 'inviteModalBackdrop') e.target.classList.remove('open');
  });

  document.getElementById('inviteForm').addEventListener('submit', async e => {
    e.preventDefault();
    const msgEl = document.getElementById('inviteMsg');
    hideMsg(msgEl);
    const btn = document.getElementById('inviteSubmitBtn');
    btn.disabled = true;

    const fd = new FormData(e.target);
    const role = fd.get('role');
    const siteIds = fd.getAll('site_ids');
    if (role === 'site_user' && !siteIds.length) {
      showMsg(msgEl, 'יש לבחור לפחות אתר אחד עבור משתמש אתר', 'error');
      btn.disabled = false;
      return;
    }
    const payload = {
      email: fd.get('email'),
      username: fd.get('username'),
      full_name: fd.get('full_name'),
      role,
      site_ids: siteIds,
    };

    const { data: { session } } = await sb.auth.getSession();
    try {
      const res = await fetch('https://odsxjatgebpwphzbevpu.supabase.co/functions/v1/invite-user', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${session.access_token}`,
        },
        body: JSON.stringify(payload),
      });
      const result = await res.json();
      if (!res.ok) throw new Error(result.error || 'שגיאה לא ידועה');

      toast('ההזמנה נשלחה בהצלחה', 'success');
      document.getElementById('inviteModalBackdrop').classList.remove('open');

      if (approvingRequestId) {
        await sb.from('signup_requests')
          .update({ status: 'approved', reviewed_by: user.id, reviewed_at: new Date().toISOString() })
          .eq('id', approvingRequestId);
        approvingRequestId = null;
        loadRequests();
      }

      loadUsers();
    } catch (err) {
      showMsg(msgEl, 'שגיאה: ' + err.message, 'error');
    } finally {
      btn.disabled = false;
    }
  });

  document.getElementById('editRoleSelect').addEventListener('change', e => {
    document.getElementById('editSiteField').style.display = e.target.value === 'owner' ? 'none' : 'flex';
  });

  function openEdit(id) {
    const u = usersCache.find(x => x.id === id);
    if (!u) return;
    const form = document.getElementById('editForm');
    form.reset();
    hideMsg(document.getElementById('editMsg'));
    form.id.value = u.id;
    form.email.value = u.email;
    form.username.value = u.username || '';
    form.full_name.value = u.full_name || '';
    form.role.value = u.role;
    form.job_title.value = u.job_title || '';
    const selectedIds = (u.profile_sites || []).map(ps => ps.site_id);
    renderSiteChecks('editSiteCheckList', selectedIds);
    document.getElementById('editSiteField').style.display = u.role === 'owner' ? 'none' : 'flex';
    document.getElementById('editModalBackdrop').classList.add('open');
  }

  document.getElementById('cancelEditBtn').addEventListener('click', () => document.getElementById('editModalBackdrop').classList.remove('open'));
  document.getElementById('editModalBackdrop').addEventListener('click', e => {
    if (e.target.id === 'editModalBackdrop') e.target.classList.remove('open');
  });

  document.getElementById('editForm').addEventListener('submit', async e => {
    e.preventDefault();
    const msgEl = document.getElementById('editMsg');
    hideMsg(msgEl);
    const btn = document.getElementById('editSubmitBtn');
    btn.disabled = true;

    const fd = new FormData(e.target);
    const id = fd.get('id');
    const role = fd.get('role');
    const siteIds = fd.getAll('site_ids');
    if (role !== 'owner' && !siteIds.length) {
      showMsg(msgEl, 'יש לבחור לפחות אתר אחד', 'error');
      btn.disabled = false;
      return;
    }
    const payload = {
      username: fd.get('username'),
      full_name: fd.get('full_name') || fd.get('username'),
      role,
      job_title: fd.get('job_title') || null,
      site_id: role === 'owner' ? null : (siteIds[0] || null),
    };

    const { error } = await sb.from('profiles').update(payload).eq('id', id);
    if (error) { showMsg(msgEl, 'שגיאה: ' + error.message, 'error'); btn.disabled = false; return; }

    await sb.from('profile_sites').delete().eq('profile_id', id);
    if (role !== 'owner' && siteIds.length) {
      const { error: sitesErr } = await sb.from('profile_sites').insert(siteIds.map(site_id => ({ profile_id: id, site_id })));
      if (sitesErr) { showMsg(msgEl, 'שגיאה בשמירת אתרים: ' + sitesErr.message, 'error'); btn.disabled = false; return; }
    }

    btn.disabled = false;
    toast('המשתמש עודכן', 'success');
    document.getElementById('editModalBackdrop').classList.remove('open');
    loadUsers();
  });

  async function resendInvite(id) {
    const u = usersCache.find(x => x.id === id);
    if (!u) return;
    if (!confirm(`לשלוח למשתמש ${u.email} קישור חדש לקביעת סיסמה?`)) return;
    const { error } = await sb.auth.resetPasswordForEmail(u.email, {
      redirectTo: 'https://sgp-site-manager.vercel.app/index.html',
    });
    if (error) { toast('שגיאה בשליחה: ' + error.message, 'error'); return; }
    toast('נשלח קישור למשתמש', 'success');
  }

  async function deleteUser(id) {
    const u = usersCache.find(x => x.id === id);
    if (!u) return;
    if (!confirm(`למחוק לצמיתות את המשתמש ${u.full_name || u.username} (${u.email})? הפעולה אינה הפיכה.`)) return;

    const { data: { session } } = await sb.auth.getSession();
    try {
      const res = await fetch('https://odsxjatgebpwphzbevpu.supabase.co/functions/v1/delete-user', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${session.access_token}`,
        },
        body: JSON.stringify({ user_id: id }),
      });
      const result = await res.json();
      if (!res.ok) throw new Error(result.error || 'שגיאה לא ידועה');
      toast('המשתמש נמחק', 'success');
      loadUsers();
    } catch (err) {
      toast('שגיאה במחיקה: ' + err.message, 'error');
    }
  }

  async function loadSites() {
    const { data, error } = await sb.from('sites').select('*').order('name');
    if (error) { document.getElementById('sitesBody').innerHTML = `<tr class="empty-row"><td>שגיאה: ${error.message}</td></tr>`; return; }
    sitesCache = data || [];
    const body = document.getElementById('sitesBody');
    if (!sitesCache.length) {
      body.innerHTML = `<tr class="empty-row"><td>אין אתרים עדיין</td></tr>`;
      return;
    }
    body.innerHTML = sitesCache.map(s => `<tr><td>${s.name}</td></tr>`).join('');
  }

  document.getElementById('addSiteBtn').addEventListener('click', () => {
    document.getElementById('siteForm').reset();
    hideMsg(document.getElementById('siteFormMsg'));
    document.getElementById('siteModalBackdrop').classList.add('open');
  });
  document.getElementById('cancelSiteBtn').addEventListener('click', () => document.getElementById('siteModalBackdrop').classList.remove('open'));
  document.getElementById('siteModalBackdrop').addEventListener('click', e => {
    if (e.target.id === 'siteModalBackdrop') e.target.classList.remove('open');
  });

  document.getElementById('siteForm').addEventListener('submit', async e => {
    e.preventDefault();
    const msgEl = document.getElementById('siteFormMsg');
    hideMsg(msgEl);
    const fd = new FormData(e.target);
    const { error } = await sb.from('sites').insert({ name: fd.get('name') });
    if (error) { showMsg(msgEl, 'שגיאה: ' + error.message, 'error'); return; }
    toast('האתר נוצר', 'success');
    document.getElementById('siteModalBackdrop').classList.remove('open');
    await loadSites();
  });

  async function loadRequests() {
    const host = document.getElementById('requestsList');
    const { data, error } = await sb.from('signup_requests')
      .select('*')
      .eq('status', 'pending')
      .order('created_at', { ascending: false });
    if (error) { host.innerHTML = `<p style="color:var(--danger);">שגיאה: ${error.message}</p>`; return; }
    if (!data || !data.length) { host.innerHTML = '<p style="color:var(--steel);">אין בקשות ממתינות</p>'; return; }

    host.innerHTML = `<div class="attach-list">${data.map(r => `
      <div class="attach-item">
        <span><strong>${r.first_name} ${r.last_name}</strong> · ${r.email} <span style="color:var(--steel);font-size:12px;">· ${fmtDate(r.created_at)}</span></span>
        <span style="display:flex;gap:6px;">
          <button type="button" class="btn btn-sm btn-primary" data-approve="${r.id}" data-email="${r.email}" data-name="${r.first_name} ${r.last_name}">אישור</button>
          <button type="button" class="btn btn-sm btn-danger" data-reject="${r.id}">דחייה</button>
        </span>
      </div>
    `).join('')}</div>`;

    host.querySelectorAll('[data-approve]').forEach(btn => {
      btn.addEventListener('click', () => openInviteModal({
        requestId: btn.dataset.approve,
        email: btn.dataset.email,
        full_name: btn.dataset.name,
      }));
    });
    host.querySelectorAll('[data-reject]').forEach(btn => {
      btn.addEventListener('click', async () => {
        if (!confirm('לדחות את הבקשה הזו?')) return;
        const { error } = await sb.from('signup_requests')
          .update({ status: 'rejected', reviewed_by: user.id, reviewed_at: new Date().toISOString() })
          .eq('id', btn.dataset.reject);
        if (error) { toast('שגיאה: ' + error.message, 'error'); return; }
        toast('הבקשה נדחתה', 'success');
        loadRequests();
      });
    });
  }

  await loadSites();
  await loadUsers();
  await loadRequests();
})();
</script>
</body>
</html>
