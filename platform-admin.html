<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ניהול הפלטפורמה</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="application-name" content="TADOK">
<meta name="apple-mobile-web-app-title" content="TADOK">
<meta name="theme-color" content="#0E1A20">
<meta property="og:type" content="website">
<meta property="og:site_name" content="TADOK">
<meta property="og:title" content="TADOK — תיעוד, בקרת איכות ושליטה באתר הבנייה">
<meta property="og:description" content="פלטפורמה לניהול אתר בנייה: יציקות, ברזל, מסמכים, בקרת איכות ודוחות.">
<meta property="og:image" content="https://tadok.vercel.app/brand/og-image.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:locale" content="he_IL">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/support.css">
<link rel="stylesheet" href="css/operator.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
.pa-grid { display: grid; grid-template-columns: 1fr 1fr; column-gap: 24px; align-items: start; }
@media (max-width: 1000px) { .pa-grid { grid-template-columns: 1fr; } }
.status-badge { font-size: 10.5px; font-weight: 800; padding: 2px 8px; border-radius: 999px; }
.status-badge.active { background: rgba(34, 216, 107,0.14); color: var(--green-deep); }
.status-badge.suspended { background: rgba(255,71,87,0.14); color: var(--danger); }
.slug-chip {
  font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11.5px;
  background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 1px 6px;
}
</style>
</head>
<body>

<header class="app-header" id="app-header"></header>

<main class="page">
  <h1 class="page-title">ניהול הפלטפורמה</h1>

  <nav class="op-tabs" role="tablist" aria-label="ניהול הפלטפורמה">
    <button type="button" role="tab" data-tab="overview" aria-selected="true">סקירה</button>
    <button type="button" role="tab" data-tab="companies" aria-selected="false">חברות</button>
    <button type="button" role="tab" data-tab="users" aria-selected="false">משתמשים</button>
    <button type="button" role="tab" data-tab="support" aria-selected="false">תמיכה <span class="nav-count" id="supportTabCount" hidden></span></button>
  </nav>

  <section data-panel="overview" role="tabpanel">
    <div id="opOverview"><div class="loading-overlay"><div class="spinner"></div></div></div>
  </section>

  <section data-panel="companies" role="tabpanel" hidden>
  <div class="card">
    <div class="card-header">
      <h2>חברות</h2>
      <button class="btn btn-primary btn-sm" id="newCompanyBtn">+ חברה חדשה</button>
    </div>
    <div id="orgsList"><div class="loading-overlay"><div class="spinner"></div></div></div>
  </div>

  <div class="card">
    <div class="card-header"><h2>בקשות לפתיחת חברה</h2></div>
    <div id="requestsList"><div class="loading-overlay"><div class="spinner"></div></div></div>
  </div>
  </section>

  <section data-panel="users" role="tabpanel" hidden>
  <div class="card">
    <div class="card-header">
      <h2>כל המשתמשים</h2>
      <input type="search" id="userSearch" class="op-search" placeholder="חיפוש לפי שם, דוא״ל או חברה" aria-label="חיפוש משתמשים">
    </div>
    <div id="opUsers"><div class="loading-overlay"><div class="spinner"></div></div></div>
  </div>
  </section>

  <section data-panel="support" role="tabpanel" hidden>
  <div class="card" id="supportCard">
    <div class="card-header">
      <h2>פניות תמיכה <span class="nav-count" id="supportNewCount" hidden></span></h2>
      <select id="supportFilter" class="site-badge" style="color:var(--ink);background:var(--bg);">
        <option value="פתוחה">פתוחות</option><option value="נענתה">נענו</option><option value="סגורה">סגורות</option><option value="">הכל</option>
      </select>
    </div>
    <div id="supportList"><div class="loading-overlay"><div class="spinner"></div></div></div>
  </div>
  </section>
</main>

<div class="modal-backdrop" id="opCompanyBackdrop">
  <div class="modal op-modal-wide" role="dialog" aria-modal="true" aria-label="פרטי חברה">
    <div id="opCompanyBody"></div>
    <div class="modal-actions"><button type="button" class="btn btn-ghost" id="opCompanyCloseBtn">סגירת החלון</button></div>
  </div>
</div>

<div class="modal-backdrop" id="opActionBackdrop">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="opActionTitle">
    <h3 id="opActionTitle"></h3>
    <p id="opActionText" style="font-size:13px;color:var(--steel);line-height:1.6;"></p>
    <form id="opActionForm">
      <div class="field full" id="opActionMemberField" hidden><label for="opActionMember">הבעלים החדש</label><select id="opActionMember"></select></div>
      <div class="field full" id="opActionDateField" hidden><label for="opActionDate">תאריך סגירה</label><input type="date" id="opActionDate"></div>
      <div class="field full"><label for="opActionReason">סיבה (נרשמת ביומן הפעולות)</label><textarea id="opActionReason" rows="2" required maxlength="500"></textarea></div>
      <div id="opActionMsg" class="msg"></div>
      <div class="modal-actions">
        <button type="submit" class="btn btn-primary" id="opActionOk">אישור</button>
        <button type="button" class="btn btn-outline" id="opActionCancel">ביטול</button>
      </div>
    </form>
  </div>
</div>

<div class="modal-backdrop" id="companyModalBackdrop">
  <div class="modal">
    <h3 id="companyModalTitle">חברה חדשה</h3>
    <p style="font-size:12.5px;color:var(--steel);margin-bottom:14px;">
      תיווצר חברה חדשה, ובעליה יקבל הזמנה במייל. קוד החברה משמש בקישור הכניסה של הקבלנים ואינו ניתן לשינוי אחר כך.
    </p>
    <div id="companyMsg" class="msg"></div>
    <form id="companyForm">
      <input type="hidden" name="request_id">
      <div class="form-grid">
        <div class="field full"><label>שם החברה *</label><input type="text" name="name" required></div>
        <div class="field full">
          <label>קוד חברה * <span style="font-weight:400;color:var(--steel);">(אותיות אנגליות קטנות, ספרות ומקף)</span></label>
          <input type="text" name="slug" required pattern="[a-z0-9]([a-z0-9-]{0,38}[a-z0-9])?" placeholder="acme-build">
        </div>
        <div class="field full"><label>אימייל הבעלים *</label><input type="email" name="owner_email" required></div>
        <div class="field"><label>שם הבעלים</label><input type="text" name="owner_full_name"></div>
        <div class="field"><label>שם משתמש</label><input type="text" name="owner_username"></div>
      </div>
      <div class="modal-actions">
        <button type="submit" class="btn btn-primary" id="companySubmitBtn">יצירה ושליחת הזמנה</button>
        <button type="button" class="btn btn-outline" id="cancelCompanyBtn">ביטול</button>
      </div>
    </form>
  </div>
</div>

<div class="modal-backdrop" id="opThreadBackdrop">
  <div class="modal sp-thread-modal" role="dialog" aria-modal="true" aria-labelledby="opThreadTitle">
    <h3 id="opThreadTitle"></h3>
    <details><summary style="cursor:pointer;font-size:12.5px;color:var(--steel);">פרטי הפונה והפרטים הטכניים</summary><div id="opThreadCtx"></div></details>
    <div id="opThread" class="sp-thread"></div>
    <div id="opReplyMsg" class="msg"></div>
    <form id="opReplyForm">
      <div class="field full"><label for="opReplyBody">תשובה</label><textarea id="opReplyBody" name="body" rows="3" required maxlength="5000"></textarea></div>
      <div class="field full"><input id="opReplyFiles" type="file" multiple accept="image/*,application/pdf"></div>
      <div class="modal-actions">
        <button type="submit" class="btn btn-primary">שליחת תשובה</button>
        <button type="button" class="btn btn-outline" id="opCloseBtn">סגירת הפנייה</button>
        <button type="button" class="btn btn-outline" id="opReopenBtn">פתיחה מחדש</button>
        <button type="button" class="btn btn-ghost" id="opThreadCloseBtn">סגירת החלון</button>
      </div>
    </form>
  </div>
</div>

<script src="js/supabase-client.js"></script>
<script src="js/policies.js"></script>
<script src="js/app.js"></script>
<script src="js/support.js"></script>
<script src="js/operator.js"></script>
<script>
(async function () {
  const auth = await requireAuth('platform-admin.html');
  if (!auth) return;
  const { user } = auth;

  // Operator-only page. The database enforces this too; this is just the UI gate.
  const { data: isAdmin } = await sb.rpc('am_i_platform_admin');
  if (!isAdmin) {
    document.querySelector('main.page').innerHTML = '<p>אין לך הרשאה לצפות בעמוד זה.</p>';
    return;
  }

  const VERSIONS = typeof tadokRequiredPolicy === 'function' ? tadokRequiredPolicy() : { terms: null, privacy: null };
  const rpc = async (name, args) => {
    const { data, error } = await sb.rpc(name, args);
    if (error) throw new Error(opErrorText(error.message));
    return data;
  };

  // ---- tabs (the hash keeps the tab on reload and makes the "waiting" links work) ----
  const loaded = {};
  function showTab(name) {
    if (!document.querySelector(`[data-panel="${name}"]`)) name = 'overview';
    document.querySelectorAll('[data-panel]').forEach(p => { p.hidden = p.dataset.panel !== name; });
    document.querySelectorAll('.op-tabs [data-tab]').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === name)));
    if (!loaded[name]) { loaded[name] = true; ({ overview: loadOverview, companies: loadOrgs, users: loadUsers, support: () => {} })[name](); }
  }
  document.querySelectorAll('.op-tabs [data-tab]').forEach(b => b.addEventListener('click', () => { location.hash = b.dataset.tab; }));
  window.addEventListener('hashchange', () => showTab(location.hash.slice(1)));

  async function loadOverview() {
    const host = document.getElementById('opOverview');
    try { host.innerHTML = opOverviewHtml(await rpc('op_overview', { p_terms: VERSIONS.terms, p_privacy: VERSIONS.privacy })); }
    catch (err) { host.innerHTML = `<p style="color:var(--danger);">שגיאה: ${esc(err.message)}</p>`; }
  }

  async function loadOrgs() {
    const host = document.getElementById('orgsList');
    try { host.innerHTML = opCompaniesHtml(await rpc('op_companies')); }
    catch (err) { host.innerHTML = `<p style="color:var(--danger);">שגיאה: ${esc(err.message)}</p>`; return; }
    host.querySelectorAll('[data-company]').forEach(b => b.addEventListener('click', () => openCompany(b.dataset.company)));
  }

  // ---- the reason dialog every operator action goes through ----
  function askAction({ title, text, members = null, date = null, okLabel = 'אישור' }) {
    return new Promise(resolve => {
      const back = document.getElementById('opActionBackdrop');
      const form = document.getElementById('opActionForm');
      form.reset();
      hideMsg(document.getElementById('opActionMsg'));
      document.getElementById('opActionTitle').textContent = title;
      document.getElementById('opActionText').textContent = text || '';
      document.getElementById('opActionOk').textContent = okLabel;
      document.getElementById('opActionMemberField').hidden = !members;
      document.getElementById('opActionMember').innerHTML = (members || []).map(m =>
        `<option value="${esc(m.user_id)}">${esc(m.full_name || m.username || m.email)} — ${esc(OP_ROLE_LABELS[m.role] || m.role)}</option>`).join('');
      document.getElementById('opActionDateField').hidden = !date;
      if (date) { const d = document.getElementById('opActionDate'); d.value = date; d.min = new Date(Date.now() + 86400000).toISOString().slice(0, 10); }
      back.classList.add('open');
      const done = value => { back.classList.remove('open'); form.onsubmit = null; resolve(value); };
      document.getElementById('opActionCancel').onclick = () => done(null);
      form.onsubmit = e => {
        e.preventDefault();
        const reason = document.getElementById('opActionReason').value.trim();
        if (!reason) { showMsg(document.getElementById('opActionMsg'), 'נדרשת סיבה', 'error'); return; }
        done({ reason, member: members ? document.getElementById('opActionMember').value : null,
               date: date ? document.getElementById('opActionDate').value : null });
      };
    });
  }

  let companyOpen = null;
  async function openCompany(id) {
    const back = document.getElementById('opCompanyBackdrop');
    const body = document.getElementById('opCompanyBody');
    body.innerHTML = '<div class="loading-overlay"><div class="spinner"></div></div>';
    back.classList.add('open');
    let c;
    try { c = await rpc('op_company', { p_org: id, p_terms: VERSIONS.terms, p_privacy: VERSIONS.privacy }); }
    catch (err) { body.innerHTML = `<p style="color:var(--danger);">שגיאה: ${esc(err.message)}</p>`; return; }
    companyOpen = c;
    body.innerHTML = opCompanyHtml(c);
    body.querySelectorAll('[data-act]').forEach(b => b.addEventListener('click', () => companyAction(b.dataset.act)));
  }
  document.getElementById('opCompanyCloseBtn').addEventListener('click', () => document.getElementById('opCompanyBackdrop').classList.remove('open'));

  async function companyAction(act) {
    const org = companyOpen.org;
    let ask, run, done;
    if (act === 'suspend') {
      ask = { title: `השעיית ${org.name}`, text: 'כל המשתמשים של החברה יאבדו גישה מיידית. הנתונים נשארים במקומם, ואפשר להחזיר את החברה בכל רגע.', okLabel: 'השעיה' };
      run = a => rpc('op_set_company_status', { p_org: org.id, p_status: 'suspended', p_reason: a.reason }); done = 'החברה הושעתה';
    } else if (act === 'activate') {
      ask = { title: `הפעלת ${org.name}`, text: 'המשתמשים של החברה יקבלו שוב גישה.', okLabel: 'הפעלה' };
      run = a => rpc('op_set_company_status', { p_org: org.id, p_status: 'active', p_reason: a.reason }); done = 'החברה הופעלה';
    } else if (act === 'transfer') {
      const members = (companyOpen.members || []).filter(m => m.role === 'admin' || m.role === 'site_user');
      if (!members.length) { toast('אין בחברה חבר שיכול לקבל בעלות (מנהל או משתמש אתר)', 'error'); return; }
      ask = { title: `העברת בעלות — ${org.name}`, text: 'הבעלים הנוכחיים יהפכו למנהלים. השתמשו בזה רק כשהבעלים עזב או אינו זמין.', members, okLabel: 'העברה' };
      run = a => rpc('op_transfer_ownership', { p_org: org.id, p_user: a.member, p_reason: a.reason }); done = 'הבעלות הועברה';
    } else if (act === 'close') {
      const in90 = new Date(Date.now() + 90 * 86400000).toISOString().slice(0, 10);
      ask = { title: `הודעת סגירה — ${org.name}`, text: 'הבעלים יראו הודעה עם התאריך וקישור לייצוא כל המידע. בתאריך הזה תשעו את החברה בעצמכם. שום מידע לא נמחק.', date: in90, okLabel: 'שליחת הודעה' };
      run = a => rpc('op_schedule_closing', { p_org: org.id, p_closing_on: a.date, p_reason: a.reason }); done = 'הודעת הסגירה נשמרה';
    } else if (act === 'cancel-close') {
      ask = { title: `ביטול הודעת הסגירה — ${org.name}`, okLabel: 'ביטול ההודעה' };
      run = a => rpc('op_cancel_closing', { p_org: org.id, p_reason: a.reason }); done = 'הודעת הסגירה בוטלה';
    } else return;
    const answer = await askAction(ask);
    if (!answer) return;
    try { await run(answer); toast(done, 'success'); }
    catch (err) { toast('הפעולה נכשלה: ' + err.message, 'error'); return; }
    loaded.overview = false; loadOrgs(); openCompany(org.id);
  }

  // ---- users ----
  let allUsers = [];
  async function loadUsers() {
    const host = document.getElementById('opUsers');
    try { allUsers = await rpc('op_users', { p_terms: VERSIONS.terms, p_privacy: VERSIONS.privacy }); }
    catch (err) { host.innerHTML = `<p style="color:var(--danger);">שגיאה: ${esc(err.message)}</p>`; return; }
    renderUsers();
  }
  function renderUsers() {
    const host = document.getElementById('opUsers');
    host.innerHTML = opUsersHtml(opFilterUsers(allUsers, document.getElementById('userSearch').value), user.id);
    host.querySelectorAll('[data-code]').forEach(b => b.addEventListener('click', () => userAction('code', b.dataset.code)));
    host.querySelectorAll('[data-block]').forEach(b => b.addEventListener('click', () => userAction('block', b.dataset.block)));
    host.querySelectorAll('[data-unblock]').forEach(b => b.addEventListener('click', () => userAction('unblock', b.dataset.unblock)));
  }
  document.getElementById('userSearch').addEventListener('input', renderUsers);

  async function userAction(kind, id) {
    const u = allUsers.find(x => x.id === id);
    if (!u) return;
    const name = u.full_name || u.username || u.email;
    const asks = {
      code: { title: `שליחת קוד כניסה — ${name}`, text: `קוד כניסה / איפוס סיסמה יישלח ל-${u.email}.`, okLabel: 'שליחה' },
      block: { title: `חסימת ${name}`, text: 'המשתמש לא יוכל להתחבר. חיבור פתוח יסתיים תוך כשעה. הנתונים שלו נשארים.', okLabel: 'חסימה' },
      unblock: { title: `שחרור החסימה — ${name}`, okLabel: 'שחרור' },
    };
    const answer = await askAction(asks[kind]);
    if (!answer) return;
    try {
      if (kind === 'code') {
        const { error } = await sb.auth.resetPasswordForEmail(u.email);
        if (error) throw new Error(error.message);
        await rpc('op_log', { p_action: 'user.send_code', p_org: u.memberships?.[0]?.org_id || null, p_target_type: 'user', p_target_id: u.id, p_reason: answer.reason, p_details: {} });
        toast('הקוד נשלח', 'success');
      } else {
        const { data: { session } } = await sb.auth.getSession();
        const res = await fetch(SUPABASE_FUNCTIONS_URL + '/op-user-action', {
          method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${session.access_token}` },
          body: JSON.stringify({ action: kind, user_id: u.id, reason: answer.reason }),
        });
        const out = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(out.error || String(res.status));
        toast(kind === 'block' ? 'המשתמש נחסם' : 'החסימה שוחררה', 'success');
        loaded.overview = false;
        await loadUsers();
      }
    } catch (err) { toast('הפעולה נכשלה: ' + err.message, 'error'); }
  }

  async function loadRequests() {
    const host = document.getElementById('requestsList');
    const { data, error } = await sb.from('company_signup_requests')
      .select('*').eq('status', 'pending').order('created_at', { ascending: false });
    if (error) { host.innerHTML = `<p style="color:var(--danger);">שגיאה: ${esc(error.message)}</p>`; return; }
    if (!data || !data.length) { host.innerHTML = '<p class="empty-state">אין בקשות ממתינות</p>'; return; }

    host.innerHTML = `<div class="attach-list">${data.map(r => `
      <div class="attach-item" style="align-items:flex-start;flex-direction:column;gap:6px;">
        <div style="font-weight:800;">${esc(r.company_name)}</div>
        <div style="font-size:12.5px;color:var(--steel);">
          ${esc(r.contact_name)} · ${esc(r.email)}${r.phone ? ' · ' + esc(r.phone) : ''}
        </div>
        ${r.note ? `<div style="font-size:12.5px;">${esc(r.note)}</div>` : ''}
        <div class="header-actions" style="margin-top:4px;">
          <button class="btn btn-sm btn-primary" data-approve="${r.id}">אישור ופתיחת חברה</button>
          <button class="btn btn-sm btn-ghost" data-reject="${r.id}">דחייה</button>
        </div>
      </div>`).join('')}</div>`;

    host.querySelectorAll('[data-approve]').forEach(btn => btn.addEventListener('click', () => {
      const r = data.find(x => x.id === btn.dataset.approve);
      openCompanyModal(r);
    }));
    host.querySelectorAll('[data-reject]').forEach(btn => btn.addEventListener('click', async () => {
      if (!confirm('לדחות את הבקשה?')) return;
      const { error } = await sb.from('company_signup_requests')
        .update({ status: 'rejected', reviewed_by: user.id, reviewed_at: new Date().toISOString() })
        .eq('id', btn.dataset.reject);
      if (error) { toast('שגיאה: ' + error.message, 'error'); return; }
      toast('הבקשה נדחתה', 'success');
      loadRequests();
    }));
  }

  function slugify(s) {
    return (s || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40);
  }

  function openCompanyModal(request) {
    const form = document.getElementById('companyForm');
    form.reset();
    hideMsg(document.getElementById('companyMsg'));
    form.request_id.value = request?.id || '';
    if (request) {
      form.name.value = request.company_name || '';
      form.slug.value = slugify(request.company_name);
      form.owner_email.value = request.email || '';
      form.owner_full_name.value = request.contact_name || '';
    }
    document.getElementById('companyModalTitle').textContent = request ? 'אישור בקשה — פתיחת חברה' : 'חברה חדשה';
    document.getElementById('companyModalBackdrop').classList.add('open');
  }

  document.getElementById('newCompanyBtn').addEventListener('click', () => openCompanyModal(null));
  document.getElementById('cancelCompanyBtn').addEventListener('click', () =>
    document.getElementById('companyModalBackdrop').classList.remove('open'));
  document.getElementById('companyModalBackdrop').addEventListener('click', e => {
    if (e.target.id === 'companyModalBackdrop') e.target.classList.remove('open');
  });
  document.getElementById('companyForm').name.addEventListener('input', e => {
    const slugField = document.getElementById('companyForm').slug;
    if (!slugField.dataset.touched) slugField.value = slugify(e.target.value);
  });
  document.getElementById('companyForm').slug.addEventListener('input', e => { e.target.dataset.touched = '1'; });

  document.getElementById('companyForm').addEventListener('submit', async e => {
    e.preventDefault();
    const msgEl = document.getElementById('companyMsg');
    const btn = document.getElementById('companySubmitBtn');
    hideMsg(msgEl);
    btn.disabled = true;

    const fd = new FormData(e.target);
    const payload = {
      name: fd.get('name'),
      slug: fd.get('slug'),
      owner_email: fd.get('owner_email'),
      owner_full_name: fd.get('owner_full_name'),
      owner_username: fd.get('owner_username'),
      request_id: fd.get('request_id') || null,
    };

    const { data: { session } } = await sb.auth.getSession();
    try {
      const res = await fetch(SUPABASE_FUNCTIONS_URL + '/create-organization', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${session.access_token}` },
        body: JSON.stringify(payload),
      });
      const out = await res.json();
      if (!res.ok) { showMsg(msgEl, 'שגיאה: ' + (out.error || res.status), 'error'); btn.disabled = false; return; }
      toast('החברה נוצרה והזמנה נשלחה לבעלים', 'success');
      document.getElementById('companyModalBackdrop').classList.remove('open');
      loadOrgs(); loadRequests();
    } catch (err) {
      showMsg(msgEl, 'שגיאה: ' + err.message, 'error');
    }
    btn.disabled = false;
  });

  let supportRows = [], opCurrent = null;
  async function loadSupport() {
    const host = document.getElementById('supportList');
    const status = document.getElementById('supportFilter').value;
    let q = sb.from('support_tickets').select('*').order('updated_at', { ascending: false }).limit(200);
    if (status) q = q.eq('status', status);
    const { data, error } = await q;
    if (error) { host.innerHTML = `<p style="color:var(--danger);">שגיאה: ${esc(error.message)}</p>`; return; }
    supportRows = data || [];
    const { count } = await sb.from('support_tickets').select('id', { count: 'exact', head: true }).eq('operator_has_unread', true);
    const badge = document.getElementById('supportNewCount');
    badge.textContent = count || ''; badge.hidden = !count;
    const tabBadge = document.getElementById('supportTabCount');
    tabBadge.textContent = count || ''; tabBadge.hidden = !count;
    if (!supportRows.length) { host.innerHTML = '<p class="empty-state">אין פניות</p>'; return; }
    host.innerHTML = supportRows.map(t => `
      <button type="button" class="sp-ticket" data-op-open="${t.id}">
        <span class="sp-sub">${t.operator_has_unread ? '<i class="sp-unread" aria-label="הודעה חדשה"></i>' : ''}<span>${esc(t.subject)}</span></span>
        <span class="sp-status ${SUPPORT_STATUS_CLASS[t.status] || ''}">${esc(t.status)}</span>
        <span class="sp-meta-line">${esc(t.context?.user || '')} · ${esc(t.context?.org || 'ללא חברה')} · ${esc(t.category)} · ${esc(supportTime(t.updated_at))}</span>
      </button>`).join('');
    host.querySelectorAll('[data-op-open]').forEach(b => b.addEventListener('click', () => openOpThread(b.dataset.opOpen)));
  }

  async function openOpThread(id) {
    // A request that just left the filtered list (closed while viewing "open") is read directly.
    opCurrent = supportRows.find(t => t.id === id)
      || (await sb.from('support_tickets').select('*').eq('id', id).maybeSingle()).data;
    if (!opCurrent) return;
    document.getElementById('opThreadTitle').textContent = `${opCurrent.subject} — ${opCurrent.status}`;
    document.getElementById('opThreadCtx').innerHTML = supportContextHtml(opCurrent.context);
    document.getElementById('opCloseBtn').hidden = opCurrent.status === 'סגורה';
    document.getElementById('opReopenBtn').hidden = opCurrent.status !== 'סגורה';
    hideMsg(document.getElementById('opReplyMsg'));
    const host = document.getElementById('opThread');
    host.innerHTML = '<div class="loading-overlay"><div class="spinner"></div></div>';
    document.getElementById('opThreadBackdrop').classList.add('open');
    try {
      const { messages, fileUrls } = await supportLoadThread(id);
      host.innerHTML = supportThreadHtml(messages, { viewerIsOperator: true, fileUrls, requesterName: opCurrent.context?.user });
      host.scrollTop = host.scrollHeight;
      if (opCurrent.operator_has_unread) { await supportMarkSeen(id, true); refreshSupportCounts(user.id); loadSupport(); }
    } catch (err) { host.innerHTML = `<p style="color:var(--danger);">שגיאה: ${esc(err.message)}</p>`; }
  }

  document.getElementById('supportFilter').addEventListener('change', loadSupport);
  document.getElementById('opReplyForm').addEventListener('submit', async e => {
    e.preventDefault();
    const msgEl = document.getElementById('opReplyMsg');
    hideMsg(msgEl);
    // preparing a camera photo takes a few seconds; a second click must not send twice
    const btn = e.target.querySelector('[type=submit]');
    btn.disabled = true;
    try {
      const files = await supportPrepareFiles(document.getElementById('opReplyFiles').files);
      const fileErr = supportCheckFiles(files);
      if (fileErr) throw new Error(fileErr);
      await supportReply(opCurrent, String(new FormData(e.target).get('body')).trim(), files);
      e.target.reset(); await loadSupport(); await openOpThread(opCurrent.id);
    } catch (err) {
      showMsg(msgEl, 'השליחה נכשלה: ' + err.message, 'error');
      msgEl.scrollIntoView({ block: 'center', behavior: 'smooth' });
    }
    btn.disabled = false;
  });
  const opSetStatus = async status => {
    try { await supportSetStatus(opCurrent.id, status); await loadSupport(); await openOpThread(opCurrent.id); }
    catch (err) { toast('שגיאה: ' + err.message, 'error'); }
  };
  document.getElementById('opCloseBtn').addEventListener('click', () => opSetStatus('סגורה'));
  document.getElementById('opReopenBtn').addEventListener('click', () => opSetStatus('פתוחה'));
  const opClose = () => document.getElementById('opThreadBackdrop').classList.remove('open');
  document.getElementById('opThreadCloseBtn').addEventListener('click', opClose);
  document.getElementById('opThreadBackdrop').addEventListener('click', e => { if (e.target.id === 'opThreadBackdrop') opClose(); });
  loadSupport();

  showTab(location.hash.slice(1) || 'overview');
  await loadRequests();
})();
</script>
</body>
</html>
