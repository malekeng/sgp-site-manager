<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>בקרה מוקדמת | TADOK</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="application-name" content="TADOK">
<meta name="apple-mobile-web-app-title" content="TADOK">
<meta name="theme-color" content="#0E1A20">
<meta property="og:type" content="website">
<meta property="og:site_name" content="TADOK">
<meta property="og:title" content="TADOK — תיעוד, בקרת איכות ושליטה באתר הבנייה">
<meta property="og:description" content="פלטפורמה לניהול אתר בנייה: יציקות, ברזל, מסמכים, בקרת איכות ודוחות.">
<meta property="og:image" content="https://tadok.vercel.app/brand/og-image.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:locale" content="he_IL">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="css/styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<header class="app-header" id="app-header"></header>

<main class="page">
  <h1 class="page-title" id="pageTitle">בקרה מוקדמת</h1>

  <div class="stats-row" id="statsRow"></div>

  <div class="card">
    <div class="card-header">
      <h2>יומן בקרה מוקדמת</h2>
      <div class="header-actions">
        <button class="btn btn-primary" id="addBtn">+ בקרה חדשה</button>
        <button class="btn btn-outline" id="filterToggle">סינון</button>
      </div>
    </div>

    <div class="filter-panel" id="filterPanel">
      <div class="filter-field"><label>מתאריך</label><input type="date" id="filterFrom"></div>
      <div class="filter-field"><label>עד תאריך</label><input type="date" id="filterTo"></div>
      <button class="btn btn-primary btn-sm" id="filterApply">החל סינון</button>
      <button class="btn btn-ghost btn-sm" id="filterClear">איפוס</button>
    </div>

    <div class="table-wrap">
      <table>
        <thead id="tableHead"></thead>
        <tbody id="tableBody">
          <tr class="empty-row"><td><div class="loading-overlay"><div class="spinner"></div></div></td></tr>
        </tbody>
      </table>
    </div>
  </div>
</main>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal">
    <button class="icon-btn modal-close" id="closeModalBtn" aria-label="סגירה"><svg class="ui-ico ui-ico-x" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
    <h3 id="modalTitle">בקרה חדשה</h3>
    <div id="formMsg" class="msg"></div>
    <form id="recordForm">
      <div class="form-grid" id="formGrid"></div>
      <div id="attachHost"></div>
      <div class="modal-actions">
        <button type="submit" class="btn btn-primary">שמירה</button>
        <button type="button" class="btn btn-outline" id="cancelBtn">ביטול</button>
      </div>
    </form>
  </div>
</div>

<script src="js/supabase-client.js"></script>
<script src="js/policies.js"></script>
<script src="js/app.js"></script>
<script src="js/documents.js"></script>
<script src="js/qc-checklists.js"></script>
<script src="js/crud.js"></script>
<script>
initCrudPage({
  table: 'quality_controls',
  staticFilter: { column: 'stage', value: 'preliminary' },
  icon: '🔍',
  activePage: 'qc-preliminary.html',
  title: 'בקרה מוקדמת',
  dateField: 'control_date',
  orderBy: { column: 'control_date', ascending: false },
  columns: [
    { key: 'control_date', label: 'תאריך בקרה', type: 'date' },
    { key: 'subject', label: 'בקרה מוקדמת ל', type: 'text' },
    { key: 'inspector', label: 'בודק / מבצע הבקרה', type: 'text' },
    { key: 'checklist', label: 'רשימת בדיקה', render: qcChecklistCell },
    { key: 'result', label: 'תוצאה', render: r => r.result ? `<span class="lic-status lic-status-${{ 'תקין': 'done', 'לא תקין': 'fail', 'בטיפול': 'progress' }[r.result] || 'open'}">${esc(r.result)}</span>${r.result === 'לא תקין' ? (r.closed_date ? ` <span class="qc-fixed">תוקן ${esc(fmtDate(r.closed_date))}</span>` : r.planned_close_date ? ` <span class="${r.planned_close_date < new Date().toISOString().slice(0, 10) ? 'ncr-late' : 'qc-due'}">תיקון עד ${esc(fmtDate(r.planned_close_date))}</span>` : '') : ''}` : '' },
    { key: 'notes', label: 'הערות', type: 'text' },
  ],
  formFields: [
    { key: 'control_date', label: 'תאריך בקרה', type: 'date', required: true },
    { key: 'subject', label: 'בקרה מוקדמת ל', type: 'select', required: true,
      options: ['יסודות', 'רצפה', 'קיר', 'קיר דיפון', 'עמודים', 'קורות', 'תקרה', 'מדרגות', 'ממ״ד', 'איטום', 'אינסטלציה', 'חשמל'] },
    { key: 'inspector', label: 'בודק / מבצע הבקרה', type: 'text' },
    { key: 'result', label: 'תוצאה (לפי רשימת הבדיקה)', type: 'select', options: ['תקין', 'לא תקין', 'בטיפול'] },
    { key: 'approved_by', label: 'נקודת עצירה — אושר ע״י', type: 'text', placeholder: 'שם ותפקיד (מפקח / מתכנן / מנהל פרויקט)' },
    { key: 'approval_date', label: 'תאריך האישור', type: 'date' },
    { key: 'severity', label: 'חומרת הליקוי (1 קל · 2 תיקון/קיזוז באישור · 3 חובת תיקון)', type: 'select', options: ['1', '2', '3'], numeric: true },
    { key: 'planned_close_date', label: 'תיקון עד', type: 'date' },
    { key: 'corrective_action', label: 'פעולה מתקנת', type: 'textarea', full: true },
    { key: 'closed_date', label: 'תוקן בתאריך', type: 'date' },
    { key: 'notes', label: 'הערות', type: 'textarea', full: true },
  ],
  formExtension: qcChecklistExtension('preliminary'),
});
function qcChecklistCell(r) {
  const list = r.checklist || [];
  if (!list.length) return '';
  const ok = list.filter(c => c.status === 'ok').length, fail = list.filter(c => c.status === 'fail').length;
  const done = list.filter(c => c.status).length;
  return `<span class="qc-mini">${done}/${list.length}${fail ? ` · <b class="qc-mini-fail">${fail} לא תקין</b>` : ok === list.length ? ' ✓' : ''}</span>`;
}
</script>
</body>
</html>
