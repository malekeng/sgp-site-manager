<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>לוח בקרה | SGP</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.png">
<link rel="stylesheet" href="css/styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<header class="app-header" id="app-header"></header>

<main class="page">
  <h1 class="page-title">לוח בקרה — <span id="siteName"></span></h1>

  <div class="card">
    <div class="card-header"><h2>דורש תשומת לב</h2></div>
    <div id="attentionList"><div class="loading-overlay"><div class="spinner"></div></div></div>
  </div>

  <div class="card">
    <div class="card-header"><h2>פעילות אחרונה</h2></div>
    <div id="recentList"><div class="loading-overlay"><div class="spinner"></div></div></div>
  </div>

  <div class="card">
    <div class="card-header"><h2>📷 תמונות אחרונות</h2></div>
    <div id="photoGallery"><div class="loading-overlay"><div class="spinner"></div></div></div>
  </div>

  <div class="card">
    <div class="card-header"><h2>גישה מהירה</h2></div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;">
      <a href="concrete.html" class="btn btn-outline" style="justify-content:center;">יומני יציקות בטון</a>
      <a href="rebar.html" class="btn btn-outline" style="justify-content:center;">משלוחי ברזל</a>
      <a href="slabs.html" class="btn btn-outline" style="justify-content:center;">לוח״דים</a>
      <a href="quantity.html" class="btn btn-outline" style="justify-content:center;">כתבי כמויות</a>
      <a href="prices.html" class="btn btn-outline" style="justify-content:center;">השוואת מחירים</a>
      <a href="reports.html" class="btn btn-outline" style="justify-content:center;">דוחות</a>
    </div>
  </div>

  <div class="stats-row" id="statsRow">
    <div class="loading-overlay"><div class="spinner"></div></div>
  </div>
</main>

<footer class="app-footer">SGP ניהול אתרי בנייה © <span id="year"></span></footer>

<script src="js/supabase-client.js"></script>
<script src="js/app.js"></script>
<script>
document.getElementById('year').textContent = new Date().getFullYear();

(async function () {
  const auth = await requireAuth('dashboard.html');
  if (!auth) return;
  const { site } = auth;
  document.getElementById('siteName').textContent = site?.name || '';

  // ===== "דורש תשומת לב" — actionable follow-ups, not raw counts =====
  async function loadAttention() {
    const items = [];

    const { data: pours } = await sb.from('concrete_pours')
      .select('id, pour_date, element, cube_test_date')
      .eq('site_id', site.id).is('cube_test_date', null)
      .order('pour_date', { ascending: false });
    (pours || []).forEach(p => items.push({
      icon: '🧪', text: `יציקה "${p.element}" מ-${fmtDate(p.pour_date)} — ללא תאריך בדיקת קוביות`,
      href: 'concrete.html',
    }));

    const { data: slabs } = await sb.from('prestressed_slabs')
      .select('id, delivery_date, supplier, slab_id, installed_date')
      .eq('site_id', site.id).is('installed_date', null)
      .order('delivery_date', { ascending: false });
    (slabs || []).forEach(s => items.push({
      icon: '🏗️', text: `לוח"ד ${s.slab_id || ''} מ-${s.supplier} (סופקה ${fmtDate(s.delivery_date)}) — טרם הותקנה`,
      href: 'slabs.html',
    }));

    const host = document.getElementById('attentionList');
    if (!items.length) {
      host.innerHTML = '<p style="color:var(--steel);font-size:14px;">אין פריטים שדורשים תשומת לב כרגע 👍</p>';
      return;
    }
    host.innerHTML = `<div class="attach-list">${items.slice(0, 8).map(it => `
      <a href="${it.href}" class="attach-item" style="text-decoration:none;color:inherit;">
        <span>${it.icon} ${it.text}</span>
        <span style="color:var(--green-deep);font-weight:700;">←</span>
      </a>
    `).join('')}</div>`;
  }

  // ===== "פעילות אחרונה" — merged recent records across all logs =====
  async function loadRecent() {
    const sources = [
      { table: 'concrete_pours', label: 'יציקת בטון', href: 'concrete.html', fmt: r => r.element, dateField: 'pour_date' },
      { table: 'rebar_deliveries', label: 'משלוח ברזל', href: 'rebar.html', fmt: r => r.supplier, dateField: 'delivery_date' },
      { table: 'prestressed_slabs', label: 'לוח״ד', href: 'slabs.html', fmt: r => r.slab_id || r.supplier, dateField: 'delivery_date' },
      { table: 'price_quotes', label: 'הצעת מחיר', href: 'prices.html', fmt: r => r.material, dateField: 'quote_date' },
    ];

    const results = await Promise.all(sources.map(s =>
      sb.from(s.table).select('*').eq('site_id', site.id).order('created_at', { ascending: false }).limit(5)
    ));

    let merged = [];
    results.forEach((res, i) => {
      (res.data || []).forEach(row => merged.push({ ...sources[i], row }));
    });
    merged.sort((a, b) => new Date(b.row.created_at) - new Date(a.row.created_at));
    merged = merged.slice(0, 8);

    const host = document.getElementById('recentList');
    if (!merged.length) {
      host.innerHTML = '<p style="color:var(--steel);font-size:14px;">אין פעילות עדיין באתר הזה</p>';
      return;
    }
    host.innerHTML = `<div class="table-wrap"><table><tbody>${merged.map(m => `
      <tr>
        <td style="white-space:nowrap;color:var(--steel);font-size:12px;">${m.label}</td>
        <td>${m.fmt(m.row) || '—'}</td>
        <td style="white-space:nowrap;">${fmtDate(m.row[m.dateField])}</td>
        <td><a href="${m.href}" class="btn btn-sm btn-outline">פתח</a></td>
      </tr>
    `).join('')}</tbody></table></div>`;
  }

  // ===== Raw counts, kept but secondary =====
  async function loadStats() {
    const tables = [
      { key: 'concrete_pours', label: 'יציקות בטון', icon: '🧱' },
      { key: 'rebar_deliveries', label: 'משלוחי ברזל', icon: '🔩' },
      { key: 'prestressed_slabs', label: 'לוח״דים', icon: '🏗️' },
      { key: 'quantity_sheets', label: 'גיליונות כמויות', icon: '📐' },
      { key: 'price_quotes', label: 'הצעות מחיר', icon: '💰' },
      { key: 'documents', label: 'מסמכים מצורפים', icon: '📎' },
    ];
    const results = await Promise.all(tables.map(t =>
      sb.from(t.key).select('id', { count: 'exact', head: true }).eq('site_id', site.id)
    ));
    const host = document.getElementById('statsRow');
    host.innerHTML = tables.map((t, i) => `
      <div class="stat-card">
        <div class="label">${t.icon} ${t.label}</div>
        <div class="value">${results[i].count ?? 0}</div>
      </div>
    `).join('');
  }

  function isImageFile(name) {
    return /\.(jpe?g|png|gif|webp|heic|bmp)$/i.test(name || '');
  }
  function openLightbox(url) {
    const overlay = document.createElement('div');
    overlay.style.cssText = 'position:fixed;inset:0;background:rgba(6,15,53,0.92);z-index:300;display:flex;align-items:center;justify-content:center;padding:20px;cursor:zoom-out;';
    overlay.innerHTML = `<img src="${url}" style="max-width:100%;max-height:100%;border-radius:8px;box-shadow:0 20px 60px rgba(0,0,0,0.5);">`;
    overlay.addEventListener('click', () => overlay.remove());
    document.body.appendChild(overlay);
  }

  async function loadPhotoGallery() {
    const host = document.getElementById('photoGallery');
    const { data, error } = await sb.from('documents')
      .select('file_path, file_name, created_at')
      .eq('site_id', site.id)
      .order('created_at', { ascending: false })
      .limit(24);
    if (error) { host.innerHTML = `<p style="color:var(--danger);">שגיאה: ${error.message}</p>`; return; }
    const images = (data || []).filter(d => isImageFile(d.file_name)).slice(0, 8);
    if (!images.length) { host.innerHTML = '<p style="color:var(--steel);">אין תמונות מצורפות עדיין באתר זה</p>'; return; }

    const resolved = await Promise.all(images.map(async d => {
      const { data: signed } = await sb.storage.from('documents').createSignedUrl(d.file_path, 3600);
      return { ...d, url: signed?.signedUrl || null };
    }));

    host.innerHTML = `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;">
      ${resolved.filter(d => d.url).map((d, i) => `
        <div data-photo="${i}" style="cursor:pointer;aspect-ratio:1;border-radius:12px;overflow:hidden;box-shadow:var(--shadow);">
          <img src="${d.url}" style="width:100%;height:100%;object-fit:cover;">
        </div>
      `).join('')}
    </div>`;
    host.querySelectorAll('[data-photo]').forEach(el => {
      el.addEventListener('click', () => openLightbox(resolved.filter(d => d.url)[Number(el.dataset.photo)].url));
    });
  }

  await Promise.all([loadAttention(), loadRecent(), loadStats(), loadPhotoGallery()]);
})();
</script>
</body>
</html>
