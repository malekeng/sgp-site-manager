<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>לוח בקרה | SGP</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.png">
<link rel="stylesheet" href="css/styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
.dashboard-grid { display: grid; grid-template-columns: 1.7fr 1fr; column-gap: 24px; align-items: start; }
@media (max-width: 1000px) { .dashboard-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<header class="app-header" id="app-header"></header>

<main class="page">
  <div class="site-hero" id="siteHero">
    <div class="site-hero-bg" id="siteHeroBg"></div>
    <div class="site-hero-overlay"></div>
    <div class="site-hero-content">
      <div class="site-hero-title" id="siteHeroTitle"></div>
      <div class="site-hero-actions" id="siteHeroActions"></div>
    </div>
  </div>

  <div class="welcome-block" id="welcomeBlock">
    <div class="welcome-left">
      <div class="avatar-md" id="welcomeAvatar"><span id="welcomeInitials">?</span></div>
      <div class="welcome-text">
        <h1 class="welcome-greeting" id="welcomeGreeting">שלום</h1>
        <div class="welcome-meta" id="welcomeMeta"></div>
      </div>
    </div>
    <a href="profile.html" class="btn btn-outline btn-sm">עריכת פרופיל</a>
  </div>

  <div class="dashboard-grid">
  <div class="dashboard-main">

  <div class="card">
    <div class="card-header">
      <h2>📌 לוח הודעות</h2>
      <button class="btn btn-primary btn-sm" id="addNoticeBtn">+ הודעה חדשה</button>
    </div>
    <div id="noticesList"><div class="loading-overlay"><div class="spinner"></div></div></div>
  </div>

  <div class="modal-backdrop" id="noticeModalBackdrop">
    <div class="modal">
      <h3>הודעה חדשה</h3>
      <div id="noticeFormMsg" class="msg"></div>
      <form id="noticeForm">
        <div class="field" style="margin-bottom:14px;">
          <label>נושא</label>
          <select name="topic">
            <option value="כללי">כללי</option>
            <option value="בטיחות">בטיחות</option>
            <option value="לוח זמנים">לוח זמנים</option>
            <option value="ציוד">ציוד</option>
            <option value="כוח אדם">כוח אדם</option>
            <option value="אספקה">אספקה</option>
            <option value="איכות">איכות</option>
            <option value="אחר">אחר</option>
          </select>
        </div>
        <div class="field">
          <label>הודעה *</label>
          <textarea name="message" rows="4" required placeholder="כל מי שנכנס לאתר יראה את ההודעה הזו"></textarea>
        </div>
        <div class="modal-actions">
          <button type="submit" class="btn btn-primary">פרסום</button>
          <button type="button" class="btn btn-outline" id="cancelNoticeBtn">ביטול</button>
        </div>
      </form>
    </div>
  </div>

  <div class="card">
    <div class="card-header">
      <h2>🏗️ גלריית ביצוע</h2>
      <button class="btn btn-primary btn-sm" id="addProgressPhotoBtn">+ הוספת תמונה</button>
    </div>
    <div id="progressGallery"><div class="loading-overlay"><div class="spinner"></div></div></div>
  </div>

  <div class="modal-backdrop" id="progressPhotoModalBackdrop">
    <div class="modal">
      <h3>הוספת תמונת ביצוע</h3>
      <div id="progressPhotoMsg" class="msg"></div>
      <form id="progressPhotoForm">
        <div class="field full">
          <label>תמונות * (ניתן לבחור כמה יחד)</label>
          <input type="file" name="photo" accept="image/*" multiple required>
        </div>
        <div class="field">
          <label>תאריך *</label>
          <input type="date" name="photo_date" required>
        </div>
        <div class="field full">
          <label>הערה</label>
          <textarea name="caption" rows="2" placeholder="תיאור קצר של שלב הביצוע..."></textarea>
        </div>
        <div class="modal-actions">
          <button type="submit" class="btn btn-primary">שמירה</button>
          <button type="button" class="btn btn-outline" id="cancelProgressPhotoBtn">ביטול</button>
        </div>
      </form>
    </div>
  </div>

  </div>

  <div class="dashboard-side">

  <div class="card">
    <div class="card-header"><h2>דורש תשומת לב</h2></div>
    <div id="attentionList" style="max-height:420px;overflow-y:auto;"><div class="loading-overlay"><div class="spinner"></div></div></div>
  </div>

  </div>
  </div>

  <div class="card">
    <div class="card-header"><h2>פעילות אחרונה</h2></div>
    <div id="recentList"><div class="loading-overlay"><div class="spinner"></div></div></div>
  </div>

  <div class="stats-row" id="statsRow">
    <div class="loading-overlay"><div class="spinner"></div></div>
  </div>
</main>

<footer class="app-footer">SGP ניהול אתרי בנייה © <span id="year"></span></footer>

<script src="js/supabase-client.js"></script>
<script src="js/app.js"></script>
<script>
document.getElementById('year').textContent = new Date().getFullYear();

function greetingByHour() {
  const h = new Date().getHours();
  if (h < 12) return 'בוקר טוב';
  if (h < 17) return 'צהריים טובים';
  if (h < 21) return 'ערב טוב';
  return 'לילה טוב';
}

(async function () {
  const auth = await requireAuth('dashboard.html');
  if (!auth) return;
  const { user, profile, site } = auth;
  const canEditSite = profile.role === 'owner' || profile.role === 'admin';
  const canEditCover = true; // any internal role reaching this dashboard (owner/admin/site_user) can set the site cover photo

  // ===== Notice board: anyone on this site can post; owner/admin or the author can delete =====
  const TOPIC_COLORS = {
    'כללי': 'var(--blue)', 'בטיחות': 'var(--danger)', 'לוח זמנים': 'var(--purple)',
    'ציוד': 'var(--orange)', 'כוח אדם': 'var(--green-deep)', 'אספקה': 'var(--blue)',
    'איכות': 'var(--purple)', 'אחר': 'var(--steel)',
  };

  async function loadNotices() {
    const host = document.getElementById('noticesList');
    const { data, error } = await sb.from('site_notices')
      .select('id, message, topic, created_at, created_by, profiles(full_name, username)')
      .eq('site_id', site.id)
      .order('created_at', { ascending: false })
      .limit(20);
    if (error) { host.innerHTML = `<p style="color:var(--danger);">שגיאה: ${esc(error.message)}</p>`; return; }
    if (!data || !data.length) { host.innerHTML = '<p style="color:var(--steel);">אין הודעות עדיין — היו הראשונים לכתוב אחת</p>'; return; }

    host.innerHTML = `<div class="attach-list">${data.map(n => {
      const authorName = esc(n.profiles?.full_name || n.profiles?.username || 'משתמש');
      const canDelete = canEditSite || n.created_by === user.id;
      const topicColor = TOPIC_COLORS[n.topic] || 'var(--steel)';
      const topicBadge = n.topic
        ? `<span style="display:inline-block;background:${topicColor};color:#fff;font-size:11px;font-weight:700;padding:2px 10px;border-radius:999px;margin-bottom:6px;">${esc(n.topic)}</span>`
        : '';
      return `
        <div class="attach-item" style="align-items:flex-start;flex-direction:column;gap:4px;">
          <div style="display:flex;justify-content:space-between;width:100%;align-items:flex-start;gap:8px;">
            <div>
              ${topicBadge}
              <div style="white-space:pre-wrap;font-size:14px;line-height:1.5;">${esc(n.message)}</div>
            </div>
            ${canDelete ? `<button type="button" class="icon-btn danger" data-del-notice="${n.id}" title="מחיקה" style="flex-shrink:0;">🗑️</button>` : ''}
          </div>
          <span style="font-size:11.5px;color:var(--steel);">${authorName} · ${fmtDate(n.created_at)}</span>
        </div>
      `;
    }).join('')}</div>`;

    host.querySelectorAll('[data-del-notice]').forEach(btn => {
      btn.addEventListener('click', async () => {
        if (!confirm('למחוק את ההודעה הזו?')) return;
        const { error } = await sb.from('site_notices').delete().eq('id', btn.dataset.delNotice);
        if (error) { toast('שגיאה: ' + error.message, 'error'); return; }
        loadNotices();
      });
    });
  }

  document.getElementById('addNoticeBtn').addEventListener('click', () => {
    document.getElementById('noticeForm').reset();
    hideMsg(document.getElementById('noticeFormMsg'));
    document.getElementById('noticeModalBackdrop').classList.add('open');
  });
  document.getElementById('cancelNoticeBtn').addEventListener('click', () => document.getElementById('noticeModalBackdrop').classList.remove('open'));
  document.getElementById('noticeModalBackdrop').addEventListener('click', e => {
    if (e.target.id === 'noticeModalBackdrop') e.target.classList.remove('open');
  });

  document.getElementById('noticeForm').addEventListener('submit', async e => {
    e.preventDefault();
    const msgEl = document.getElementById('noticeFormMsg');
    hideMsg(msgEl);
    const fd = new FormData(e.target);
    const message = (fd.get('message') || '').trim();
    if (!message) { showMsg(msgEl, 'יש לכתוב הודעה', 'error'); return; }

    const { error } = await sb.from('site_notices')
      .insert({ site_id: site.id, topic: fd.get('topic'), message, created_by: user.id });
    if (error) { showMsg(msgEl, 'שגיאה: ' + error.message, 'error'); return; }

    toast('ההודעה פורסמה', 'success');
    document.getElementById('noticeModalBackdrop').classList.remove('open');
    loadNotices();
  });

  loadNotices();

  // Welcome
  const name = profileDisplayName(profile);
  document.getElementById('welcomeGreeting').textContent =
    name ? `${greetingByHour()}, ${name}` : greetingByHour();
  const metaParts = [];
  if (profile.job_title) metaParts.push(profile.job_title);
  metaParts.push(systemRoleLabel(profile.role));
  document.getElementById('welcomeMeta').textContent = metaParts.join(' · ');
  document.getElementById('welcomeInitials').textContent = profileInitials(profile);

  if (profile.avatar_path) {
    const url = await getStorageUrl(profile.avatar_path);
    if (url) {
      const box = document.getElementById('welcomeAvatar');
      box.innerHTML = `<img src="${url}" alt="">`;
    }
  }

  // Site hero
  document.getElementById('siteHeroTitle').textContent = site?.name || 'אתר';
  const heroBg = document.getElementById('siteHeroBg');
  const heroActions = document.getElementById('siteHeroActions');

  async function applyCover(path) {
    if (!path) {
      heroBg.style.backgroundImage = '';
      document.getElementById('siteHero').classList.remove('has-cover');
      return;
    }
    const url = await getStorageUrl(path);
    if (!url) return;
    heroBg.style.backgroundImage = `url("${url}")`;
    document.getElementById('siteHero').classList.add('has-cover');
  }
  await applyCover(site.cover_path);

  if (canEditCover) {
    heroActions.innerHTML = `
      <label class="btn btn-sm site-cover-btn" style="cursor:pointer;">
        📷 ${site.cover_path ? 'החלפת תמונת אתר' : 'העלאת תמונת אתר'}
        <input type="file" id="coverInput" accept="image/*" style="display:none;">
      </label>
      ${site.cover_path ? '<button type="button" class="btn btn-sm btn-ghost site-cover-btn" id="removeCoverBtn">הסרה</button>' : ''}
    `;

    document.getElementById('coverInput')?.addEventListener('change', async e => {
      const file = e.target.files?.[0];
      e.target.value = '';
      if (!file) return;
      if (file.size > 8 * 1024 * 1024) { toast('הקובץ גדול מ-8MB', 'error'); return; }
      if (!file.type.startsWith('image/')) { toast('יש לבחור קובץ תמונה', 'error'); return; }

      const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
      const path = `${site.id}/site-covers/cover_${Date.now()}.${ext}`;
      toast('מעלה תמונת אתר...');
      const { error: upErr } = await sb.storage.from('documents').upload(path, file, { upsert: true, contentType: file.type });
      if (upErr) { toast('שגיאה בהעלאה: ' + upErr.message, 'error'); return; }

      if (site.cover_path && site.cover_path !== path) {
        await sb.storage.from('documents').remove([site.cover_path]).catch(() => {});
      }

      const { error } = await sb.from('sites').update({ cover_path: path }).eq('id', site.id);
      if (error) { toast('שגיאה בשמירה: ' + error.message, 'error'); return; }
      site.cover_path = path;
      await applyCover(path);
      toast('תמונת האתר עודכנה', 'success');
      // refresh action buttons
      location.reload();
    });

    document.getElementById('removeCoverBtn')?.addEventListener('click', async () => {
      if (!confirm('להסיר את תמונת האתר?')) return;
      if (site.cover_path) await sb.storage.from('documents').remove([site.cover_path]).catch(() => {});
      const { error } = await sb.from('sites').update({ cover_path: null }).eq('id', site.id);
      if (error) { toast('שגיאה: ' + error.message, 'error'); return; }
      site.cover_path = null;
      await applyCover(null);
      toast('התמונה הוסרה', 'success');
      location.reload();
    });
  }

  async function loadAttention() {
    const items = [];

    const { data: pours } = await sb.from('concrete_pours')
      .select('id, pour_date, element, cube_test_date')
      .eq('site_id', site.id).is('cube_test_date', null)
      .order('pour_date', { ascending: false });
    (pours || []).forEach(p => items.push({
      icon: '🧪', text: `יציקה "${p.element}" מ-${fmtDate(p.pour_date)} — ללא תאריך בדיקת קוביות`,
      href: 'concrete.html',
    }));

    const { data: slabs } = await sb.from('prestressed_slabs')
      .select('id, delivery_date, supplier, quantity_m2, delivery_note_number, installed_date')
      .eq('site_id', site.id).is('installed_date', null)
      .order('delivery_date', { ascending: false });
    (slabs || []).forEach(s => {
      const qty = s.quantity_m2 != null ? `${s.quantity_m2} מ\"ר` : '';
      const note = s.delivery_note_number ? `תעודה ${s.delivery_note_number}` : '';
      const detail = [qty, note].filter(Boolean).join(' · ');
      items.push({
        icon: '🏗️',
        text: `לוח\"ד מ-${s.supplier}${detail ? ' (' + detail + ')' : ''} (סופקה ${fmtDate(s.delivery_date)}) — טרם הותקנה`,
        href: 'slabs.html',
      });
    });

    const VENDOR_TYPE_HREF = { contractor: 'vendor-contractors.html', supplier: 'vendor-suppliers.html', equipment: 'vendor-equipment.html', material: 'vendor-materials.html' };
    const VENDOR_TYPE_LABEL = { contractor: 'קבלן', supplier: 'ספק', equipment: 'ציוד', material: 'חומר' };
    const soonThreshold = new Date(); soonThreshold.setDate(soonThreshold.getDate() + 30);
    const { data: expiring } = await sb.from('vendor_submissions')
      .select('id, submission_type, name, valid_until')
      .eq('site_id', site.id).not('valid_until', 'is', null).lte('valid_until', soonThreshold.toISOString().slice(0, 10))
      .order('valid_until', { ascending: true });
    (expiring || []).forEach(v => {
      const expired = new Date(v.valid_until) < new Date(new Date().toDateString());
      items.push({
        icon: expired ? '🔴' : '🟠',
        text: `${VENDOR_TYPE_LABEL[v.submission_type] || ''} "${v.name}" — תוקף ${expired ? 'פג ב' : 'עומד לפוג ב'}-${fmtDate(v.valid_until)}`,
        href: VENDOR_TYPE_HREF[v.submission_type] || 'reports.html',
      });
    });

    const { data: failedQc } = await sb.from('quality_controls')
      .select('id, stage, subject, control_date')
      .eq('site_id', site.id).eq('result', 'לא תקין')
      .order('control_date', { ascending: false });
    (failedQc || []).forEach(q => items.push({
      icon: '❌',
      text: `בקרה ${q.stage === 'preliminary' ? 'מקדימה' : 'בתהליך'} ל"${q.subject}" מ-${fmtDate(q.control_date)} — לא תקין`,
      href: q.stage === 'preliminary' ? 'qc-preliminary.html' : 'qc-inprocess.html',
    }));

    const host = document.getElementById('attentionList');
    if (!items.length) {
      host.innerHTML = '<p style="color:var(--steel);font-size:14px;">אין פריטים שדורשים תשומת לב כרגע 👍</p>';
      return;
    }
    host.innerHTML = `<div class="attach-list">${items.slice(0, 10).map(it => `
      <a href="${it.href}" class="attach-item" style="text-decoration:none;color:inherit;">
        <span>${it.icon} ${esc(it.text)}</span>
        <span style="color:var(--green-deep);font-weight:700;">←</span>
      </a>
    `).join('')}</div>`;
  }

  async function loadRecent() {
    const sources = [
      { table: 'concrete_pours', label: 'יציקת בטון', href: 'concrete.html', fmt: r => r.element, dateField: 'pour_date' },
      { table: 'rebar_deliveries', label: 'משלוח ברזל', href: 'rebar.html', fmt: r => r.supplier, dateField: 'order_date' },
      { table: 'prestressed_slabs', label: 'לוח״ד', href: 'slabs.html', fmt: r => {
          const parts = [r.supplier];
          if (r.quantity_m2 != null) parts.push(r.quantity_m2 + ' מ\"ר');
          if (r.delivery_note_number) parts.push('תעודה ' + r.delivery_note_number);
          return parts.join(' · ');
        }, dateField: 'delivery_date' },
      { table: 'price_quotes', label: 'הצעת מחיר', href: 'prices.html', fmt: r => r.material, dateField: 'quote_date' },
      { table: 'exceptions', label: 'חריג', href: 'exceptions.html', fmt: r => r.description || r.category, dateField: 'exception_date' },
      { table: 'vendor_submissions', label: 'הגשה', fmt: r => r.name, dateField: 'submission_date',
        hrefFn: r => ({ contractor: 'vendor-contractors.html', supplier: 'vendor-suppliers.html', equipment: 'vendor-equipment.html', material: 'vendor-materials.html' }[r.submission_type] || 'reports.html') },
      { table: 'quality_controls', label: 'בקרת איכות', fmt: r => r.subject, dateField: 'control_date',
        hrefFn: r => r.stage === 'preliminary' ? 'qc-preliminary.html' : 'qc-inprocess.html' },
      { table: 'facility_file_items', label: 'תיק מתקן', href: 'facility-file.html', fmt: r => r.item_name, dateField: 'due_date' },
    ];

    const results = await Promise.all(sources.map(s =>
      sb.from(s.table).select('*').eq('site_id', site.id).order('created_at', { ascending: false }).limit(5)
    ));

    let merged = [];
    results.forEach((res, i) => {
      (res.data || []).forEach(row => merged.push({ ...sources[i], row }));
    });
    merged.sort((a, b) => new Date(b.row.created_at || 0) - new Date(a.row.created_at || 0));
    merged = merged.slice(0, 10);

    const host = document.getElementById('recentList');
    if (!merged.length) {
      host.innerHTML = '<p style="color:var(--steel);font-size:14px;">אין פעילות עדיין באתר הזה</p>';
      return;
    }
    host.innerHTML = `<div class="table-wrap"><table><tbody>${merged.map(m => `
      <tr>
        <td style="white-space:nowrap;color:var(--steel);font-size:12px;">${esc(m.label)}</td>
        <td>${esc(m.fmt(m.row) || '—')}</td>
        <td style="white-space:nowrap;">${esc(fmtDate(m.row[m.dateField]))}</td>
        <td><a href="${m.hrefFn ? m.hrefFn(m.row) : m.href}" class="btn btn-sm btn-outline">פתח</a></td>
      </tr>
    `).join('')}</tbody></table></div>`;
  }

  async function loadStats() {
    const tables = [
      { key: 'concrete_pours', label: 'יציקות בטון', icon: '🧱' },
      { key: 'rebar_deliveries', label: 'משלוחי ברזל', icon: '🔩' },
      { key: 'prestressed_slabs', label: 'לוח״דים', icon: '🏗️' },
      { key: 'exceptions', label: 'חריגים', icon: '⚠️' },
      { key: 'quantity_sheets', label: 'גיליונות כמויות', icon: '📐' },
      { key: 'price_quotes', label: 'הצעות מחיר', icon: '💰' },
      { key: 'vendor_submissions', label: 'הגשות קבלנים/ספקים/ציוד/חומר', icon: '📥' },
      { key: 'quality_controls', label: 'בקרות איכות', icon: '✅' },
      { key: 'facility_file_items', label: 'תיק מתקן', icon: '📜' },
      { key: 'documents', label: 'מסמכים מצורפים', icon: '📎' },
    ];
    const results = await Promise.all(tables.map(t =>
      sb.from(t.key).select('id', { count: 'exact', head: true }).eq('site_id', site.id)
    ));
    const host = document.getElementById('statsRow');
    host.innerHTML = tables.map((t, i) => `
      <div class="stat-card">
        <div class="label">${t.icon} ${t.label}</div>
        <div class="value">${results[i].count ?? 0}</div>
      </div>
    `).join('');
  }

  function isImageFile(name) {
    return /\.(jpe?g|png|gif|webp|heic|bmp)$/i.test(name || '');
  }
  function openLightbox(url) {
    const overlay = document.createElement('div');
    overlay.style.cssText = 'position:fixed;inset:0;background:rgba(6,15,53,0.92);z-index:300;display:flex;align-items:center;justify-content:center;padding:20px;cursor:zoom-out;';
    overlay.innerHTML = `<img src="${url}" style="max-width:100%;max-height:100%;border-radius:8px;box-shadow:0 20px 60px rgba(0,0,0,0.5);">`;
    overlay.addEventListener('click', () => overlay.remove());
    document.body.appendChild(overlay);
  }

  async function loadProgressGallery() {
    const host = document.getElementById('progressGallery');
    const { data, error } = await sb.from('documents')
      .select('*')
      .eq('site_id', site.id)
      .eq('linked_table', 'progress_gallery')
      .order('document_date', { ascending: false })
      .order('created_at', { ascending: false })
      .limit(24);
    if (error) { host.innerHTML = `<p style="color:var(--danger);">שגיאה: ${esc(error.message)}</p>`; return; }
    if (!data || !data.length) { host.innerHTML = '<p style="color:var(--steel);">אין תמונות ביצוע עדיין — היו הראשונים להוסיף</p>'; return; }

    const resolved = await Promise.all(data.map(async d => {
      const { data: signed } = await sb.storage.from('documents').createSignedUrl(d.file_path, 3600);
      return { ...d, url: signed?.signedUrl || null };
    }));

    host.innerHTML = `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;">
      ${resolved.filter(d => d.url).map((d, i) => `
        <div>
          <div data-photo="${i}" style="cursor:pointer;aspect-ratio:1;border-radius:12px;overflow:hidden;box-shadow:var(--shadow);">
            <img src="${d.url}" style="width:100%;height:100%;object-fit:cover;">
          </div>
          <div style="font-size:11.5px;color:var(--steel);margin-top:6px;font-weight:600;">${esc(fmtDate(d.document_date))}</div>
          ${d.notes ? `<div style="font-size:12.5px;color:var(--ink);margin-top:2px;line-height:1.4;">${esc(d.notes)}</div>` : ''}
        </div>
      `).join('')}
    </div>`;
    const withUrls = resolved.filter(d => d.url);
    host.querySelectorAll('[data-photo]').forEach(el => {
      el.addEventListener('click', () => openLightbox(withUrls[Number(el.dataset.photo)].url));
    });
  }

  document.getElementById('addProgressPhotoBtn').addEventListener('click', () => {
    document.getElementById('progressPhotoForm').reset();
    hideMsg(document.getElementById('progressPhotoMsg'));
    document.querySelector('#progressPhotoForm [name=photo_date]').value = new Date().toISOString().slice(0, 10);
    document.getElementById('progressPhotoModalBackdrop').classList.add('open');
  });
  document.getElementById('cancelProgressPhotoBtn').addEventListener('click', () => document.getElementById('progressPhotoModalBackdrop').classList.remove('open'));
  document.getElementById('progressPhotoModalBackdrop').addEventListener('click', e => {
    if (e.target.id === 'progressPhotoModalBackdrop') e.target.classList.remove('open');
  });

  document.getElementById('progressPhotoForm').addEventListener('submit', async e => {
    e.preventDefault();
    const msgEl = document.getElementById('progressPhotoMsg');
    hideMsg(msgEl);
    const fd = new FormData(e.target);
    const files = Array.from(document.querySelector('#progressPhotoForm [name=photo]').files);
    if (!files.length) { showMsg(msgEl, 'יש לבחור תמונה אחת לפחות', 'error'); return; }

    const submitBtn = e.target.querySelector('[type=submit]');
    submitBtn.disabled = true;
    try {
      for (const file of files) {
        const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
        const path = `${site.id}/progress-gallery/${Date.now()}_${Math.random().toString(36).slice(2, 8)}.${ext}`;
        const { error: upErr } = await sb.storage.from('documents').upload(path, file, { contentType: file.type });
        if (upErr) throw upErr;

        const { error: dbErr } = await sb.from('documents').insert({
          site_id: site.id,
          doc_type: 'photo',
          title: file.name,
          file_path: path,
          file_name: file.name,
          file_size: file.size,
          linked_table: 'progress_gallery',
          notes: fd.get('caption') || null,
          document_date: fd.get('photo_date'),
          uploaded_by: user.id,
        });
        if (dbErr) throw dbErr;
      }

      toast(files.length > 1 ? `${files.length} תמונות נוספו לגלריה` : 'התמונה נוספה לגלריה', 'success');
      document.getElementById('progressPhotoModalBackdrop').classList.remove('open');
      await loadProgressGallery();
    } catch (err) {
      showMsg(msgEl, 'שגיאה: ' + err.message, 'error');
    } finally {
      submitBtn.disabled = false;
    }
  });

  await Promise.all([loadAttention(), loadRecent(), loadStats(), loadProgressGallery()]);
})();
</script>
</body>
</html>
