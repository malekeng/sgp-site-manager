<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>כניסת קבלנים | TADOK</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="application-name" content="TADOK">
<meta name="apple-mobile-web-app-title" content="TADOK">
<meta name="theme-color" content="#0E1A20">
<meta property="og:type" content="website">
<meta property="og:site_name" content="TADOK">
<meta property="og:title" content="TADOK — תיעוד, בקרת איכות ושליטה באתר הבנייה">
<meta property="og:description" content="פלטפורמה לניהול אתר בנייה: יציקות, ברזל, מסמכים, בקרת איכות ודוחות.">
<meta property="og:image" content="https://tadok.vercel.app/brand/og-image.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:locale" content="he_IL">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="css/styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
.password-wrap { position: relative; }
.password-wrap input { padding-left: 42px; }
.password-toggle {
  position: absolute; left: 8px; top: 50%; transform: translateY(-50%);
  width: 30px; height: 30px; display: flex; align-items: center; justify-content: center;
  border-radius: 8px; font-size: 15px; color: var(--steel); cursor: pointer;
}
.btn:disabled { opacity: 0.6; pointer-events: none; }
</style>
</head>
<body>

<div class="auth-split">
  <div class="auth-visual">
    <div class="auth-visual-top"><img src="brand/tadok-logo-transparent.png" alt="TADOK"></div>
    <div class="auth-visual-body">
      <h2>המשימות שלך,<br>ברורות מכל מקום.</h2>
      <p>היכנסו עם מספר הטלפון והסיסמה שקיבלתם כדי לראות את המשימות שהוקצו לכם ולסמן אותן כבוצעו.</p>
    </div>
    <div class="auth-visual-foot"><span class="dot"></span>ניהול אתרי בנייה</div>
  </div>
  <div class="auth-form-panel" style="padding-bottom:max(20px, env(safe-area-inset-bottom));">
  <div class="auth-card">
    <div class="auth-brand"><img src="brand/tadok-logo-transparent.png" alt="TADOK"></div>
    <div class="tagline">כניסת קבלנים</div>

    <div id="msg" class="msg" aria-live="polite" role="status"></div>

    <form id="loginForm">
      <div class="field" id="orgSlugField">
        <label for="orgSlugInput">קוד חברה</label>
        <input id="orgSlugInput" type="text" autocomplete="organization" placeholder="לדוגמה: sgp">
      </div>
      <div class="field">
        <label for="phoneInput">מספר טלפון</label>
        <input id="phoneInput" type="tel" name="phone" required autocomplete="tel" placeholder="050-1234567">
      </div>
      <div class="field">
        <label for="passwordInput">סיסמה</label>
        <div class="password-wrap">
          <input id="passwordInput" type="password" name="password" required autocomplete="current-password">
          <span class="password-toggle" id="pwToggle" role="button" tabindex="0" aria-label="הצג סיסמה"><svg class="ui-ico ui-ico-eye" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg></span>
        </div>
      </div>
      <button type="submit" class="btn btn-primary" id="loginBtn">
        <span id="loginBtnText">כניסה</span>
      </button>
    </form>
    <a href="index.html" style="display:block;text-align:center;margin-top:14px;font-size:13px;color:var(--steel);">חזרה למסך הכניסה הראשי</a>
    <div class="auth-legal" data-legal-links><a href="privacy.html">מדיניות פרטיות</a><span aria-hidden="true">·</span><a href="terms.html">תנאי שימוש</a></div>
  </div>
  </div>
</div>

<script src="js/supabase-client.js"></script>
<script src="js/policies.js"></script>
<script>
const msgEl = document.getElementById('msg');
function hideMsg() { msgEl.className = 'msg'; }
function showErr(text) { msgEl.textContent = text; msgEl.className = 'msg show error'; }

(function () {
  const toggle = document.getElementById('pwToggle');
  function flip() {
    const input = document.getElementById('passwordInput');
    const showing = input.type === 'text';
    input.type = showing ? 'password' : 'text';
    toggle.innerHTML = showing ? '<svg class="ui-ico ui-ico-eye" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>' : '<svg class="ui-ico ui-ico-eye-off" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"/><path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"/><path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"/><path d="m2 2 20 20"/></svg>';
    toggle.setAttribute('aria-label', showing ? 'הצג סיסמה' : 'הסתר סיסמה');
  }
  toggle.addEventListener('click', flip);
  toggle.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); flip(); } });
})();

// Contractor accounts are per company, so the synthetic login email carries the company
// code: c{digits}.{slug}@... The code comes from ?org= in the link the company sends,
// and is then remembered on this device.
const ORG_SLUG_KEY = 'sgp_contractor_org_slug';

function currentOrgSlug() {
  const fromUrl = (new URLSearchParams(location.search).get('org') || '').trim().toLowerCase();
  if (fromUrl) { try { localStorage.setItem(ORG_SLUG_KEY, fromUrl); } catch (_) {} return fromUrl; }
  const field = document.getElementById('orgSlugInput');
  const typed = (field?.value || '').trim().toLowerCase();
  if (typed) { try { localStorage.setItem(ORG_SLUG_KEY, typed); } catch (_) {} return typed; }
  try { return (localStorage.getItem(ORG_SLUG_KEY) || '').trim().toLowerCase(); } catch (_) { return ''; }
}

function phoneToSyntheticEmail(phone, slug) {
  const digits = phone.replace(/\D/g, '');
  return `c${digits}.${slug}@contractor.sgp.internal`;
}

// Show the company-code field only when we do not already know it.
(function initOrgField() {
  const wrap = document.getElementById('orgSlugField');
  if (!wrap) return;
  const known = (new URLSearchParams(location.search).get('org') || '').trim()
    || (() => { try { return localStorage.getItem(ORG_SLUG_KEY) || ''; } catch (_) { return ''; } })();
  if (known) wrap.hidden = true;
})();

document.getElementById('loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  hideMsg();
  const btn = document.getElementById('loginBtn');
  const btnText = document.getElementById('loginBtnText');
  btn.disabled = true;
  btnText.textContent = 'מתחבר...';

  const fd = new FormData(e.target);
  const slug = currentOrgSlug();
  if (!slug) {
    showErr('חסר קוד חברה — השתמשו בקישור שקיבלתם מהחברה');
    btn.disabled = false;
    btnText.textContent = 'כניסה';
    return;
  }
  const email = phoneToSyntheticEmail(fd.get('phone'), slug);
  const { error } = await sb.auth.signInWithPassword({ email, password: fd.get('password') });

  if (error) {
    showErr('מספר טלפון או סיסמה שגויים');
    btn.disabled = false;
    btnText.textContent = 'כניסה';
    return;
  }
  window.location.href = 'contractor-tasks.html';
});

(async function () {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return;
  // Roles live per company now, so ask organization_members rather than profiles.role.
  // Only auto-redirect an already-logged-in contractor. A non-contractor
  // (owner/admin/site_user) landing here should just see the login form, not get
  // silently bounced or signed out of their existing session.
  const { data: m } = await sb.from('organization_members')
    .select('role').eq('user_id', session.user.id).eq('role', 'contractor').limit(1);
  if (m && m.length) window.location.href = 'contractor-tasks.html';
})();
</script>
</body>
</html>
