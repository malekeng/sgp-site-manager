<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>חריגים | TADOK</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="application-name" content="TADOK">
<meta name="apple-mobile-web-app-title" content="TADOK">
<meta name="theme-color" content="#0E1A20">
<meta property="og:type" content="website">
<meta property="og:site_name" content="TADOK">
<meta property="og:title" content="TADOK — תיעוד, בקרת איכות ושליטה באתר הבנייה">
<meta property="og:description" content="פלטפורמה לניהול אתר בנייה: יציקות, ברזל, מסמכים, בקרת איכות ודוחות.">
<meta property="og:image" content="https://tadok.vercel.app/brand/og-image.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:locale" content="he_IL">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="css/styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<header class="app-header" id="app-header"></header>

<main class="page">
  <h1 class="page-title" id="pageTitle">חריגים — עבודות נוספות מעבר להצעת המחיר</h1>

  <div class="stats-row" id="statsRow"></div>

  <section class="card xw-card" id="xwCard" hidden>
    <div class="card-header"><h2>סיכום חריגים</h2><span class="lic-sub">לגבייה — אנחנו דורשים · לתשלום — דורשים מאיתנו</span></div>
    <div id="xwSummary" class="xw-summary"></div>
  </section>

  <div class="card">
    <div class="card-header">
      <h2>יומן חריגים</h2>
      <div class="header-actions">
        <button class="btn btn-primary" id="addBtn">+ הוספת חריג</button>
        <button class="btn btn-outline" id="filterToggle">סינון</button>
      </div>
    </div>

    <div class="filter-panel" id="filterPanel">
      <div class="filter-field"><label>מתאריך</label><input type="date" id="filterFrom"></div>
      <div class="filter-field"><label>עד תאריך</label><input type="date" id="filterTo"></div>
      <button class="btn btn-primary btn-sm" id="filterApply">החל סינון</button>
      <button class="btn btn-ghost btn-sm" id="filterClear">איפוס</button>
    </div>

    <div class="table-wrap">
      <table>
        <thead id="tableHead"></thead>
        <tbody id="tableBody">
          <tr class="empty-row"><td><div class="loading-overlay"><div class="spinner"></div></div></td></tr>
        </tbody>
      </table>
    </div>
  </div>
</main>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal">
    <button class="icon-btn modal-close" id="closeModalBtn" aria-label="סגירה"><svg class="ui-ico ui-ico-x" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
    <h3 id="modalTitle">הוספת חריג</h3>
    <div id="formMsg" class="msg"></div>
    <form id="recordForm">
      <div class="form-grid" id="formGrid"></div>
      <div id="attachHost"></div>
      <div class="modal-actions">
        <button type="submit" class="btn btn-primary">שמירה</button>
        <button type="button" class="btn btn-outline" id="cancelBtn">ביטול</button>
      </div>
    </form>
  </div>
</div>

<script src="js/supabase-client.js"></script>
<script src="js/policies.js"></script>
<script src="js/app.js"></script>
<script src="js/documents.js"></script>
<script src="js/crud.js"></script>
<script>
const XW_STATUS_TONE = { 'טיוטה': 'open', 'הוגש': 'progress', 'בבדיקה': 'progress', 'אושר': 'done', 'אושר חלקית': 'done', 'נדחה': 'fail', 'שולם': 'done' };
const XW_PENDING = ['הוגש', 'בבדיקה'];
const xwMoney = v => (v === null || v === undefined || v === '' ? '' : `${fmtNum(v, 0)} ₪`);
const xwToday = () => new Date().toISOString().slice(0, 10);
const xwCount = k => (k === 1 ? "חריג אחד" : `${k} חריגים`);
// a claim that has been waiting for a decision for more than 30 days
function xwWaiting(r) {
  if (!XW_PENDING.includes(r.status) || !r.submitted_date) return '';
  const days = Math.round((Date.parse(xwToday()) - Date.parse(r.submitted_date)) / 86400000);
  return days > 30 ? ` <span class="ncr-late">ממתין ${days} ימים</span>` : '';
}
initCrudPage({
  table: 'exceptions', icon: '⚠️',
  activePage: 'exceptions.html',
  title: 'חריגים — עבודות נוספות מעבר להצעת המחיר',
  dateField: 'exception_date',
  orderBy: { column: 'exception_date', ascending: false },
  columns: [
    { key: 'exception_date', label: 'תאריך', type: 'date' },
    { key: 'direction', label: 'כיוון', render: r => r.direction
      ? `<span class="xw-dir xw-${r.direction === 'לגבייה' ? 'in' : 'out'}">${esc(r.direction)}</span>${r.party_name || r.party_type ? `<div class="xw-sub">${esc(r.party_name || r.party_type)}</div>` : ''}` : '' },
    { key: 'description', label: 'העבודה הנוספת', render: r => `${esc(String(r.description || '').slice(0, 90))}${r.location ? `<div class="xw-sub">${esc(r.location)}</div>` : ''}` },
    { key: 'instructed_by', label: 'הוראה', render: r => r.instructed_by
      ? `${esc(r.instructed_by)}${r.instruction_ref ? `<div class="xw-sub">${esc(r.instruction_ref)}</div>` : ''}`
      : '<span class="xw-noinst" title="בלי הוראה בכתב קשה לגבות חריג">אין הוראה</span>' },
    { key: 'claimed_amount', label: 'נדרש', render: r => xwMoney(r.claimed_amount) },
    { key: 'approved_amount', label: 'אושר', render: r => xwMoney(r.approved_amount) },
    { key: 'status', label: 'סטטוס', render: r => r.status ? `<span class="lic-status lic-status-${XW_STATUS_TONE[r.status] || 'open'}">${esc(r.status)}</span>${xwWaiting(r)}` : '' },
  ],
  formFields: [
    { key: 'exception_date', label: 'תאריך (ההוראה / הביצוע)', type: 'date', required: true },
    { key: 'direction', label: 'כיוון', type: 'select', required: true, options: ['לגבייה', 'לתשלום'] },
    { key: 'party_type', label: 'מול', type: 'select', options: ['יזם / מזמין', 'קבלן ראשי', 'קבלן משנה', 'ספק'] },
    { key: 'party_name', label: 'שם הצד השני', type: 'text' },
    { key: 'category', label: 'סוג העבודה', type: 'select',
      options: ['עבודות עפר', 'יציקת בטון', 'ברזל', 'טפסנות', 'לוח\"דים', 'איטום', 'מערכות', 'פיתוח', 'כמויות'] },
    { key: 'location', label: 'מיקום / אלמנט', type: 'text' },
    { key: 'description', label: 'תיאור העבודה הנוספת', type: 'textarea', full: true, required: true },
    { key: 'instructed_by', label: 'מי הורה על העבודה', type: 'text', placeholder: 'שם ותפקיד — מפקח, מנהל פרויקט, יזם...' },
    { key: 'instruction_ref', label: 'אסמכתא להוראה', type: 'text', placeholder: 'מס׳ הוראת שינוי / דף יומן / מייל' },
    { key: 'quantity', label: 'כמות', type: 'number', step: '0.01' },
    { key: 'unit', label: 'יחידה', type: 'datalist', options: ['מ\"ק', 'מ\"ר', 'מ\"א', 'טון', 'ק\"ג', 'יח\'', 'קומפלט', 'שעות עבודה', 'ימי עבודה'] },
    { key: 'unit_price', label: 'מחיר ליחידה (₪)', type: 'number', step: '0.01' },
    { key: 'claimed_amount', label: 'סכום נדרש (₪)', type: 'number', step: '0.01' },
    { key: 'status', label: 'סטטוס', type: 'select', required: true, options: ['טיוטה', 'הוגש', 'בבדיקה', 'אושר', 'אושר חלקית', 'נדחה', 'שולם'] },
    { key: 'submitted_date', label: 'תאריך הגשה', type: 'date' },
    { key: 'decision_date', label: 'תאריך החלטה', type: 'date' },
    { key: 'approved_amount', label: 'סכום שאושר (₪)', type: 'number', step: '0.01' },
    { key: 'notes', label: 'הערות / עדכונים', type: 'textarea', full: true },
  ],
  formExtension: {
    // quantity × unit price fills the amount; an amount typed by hand is kept
    mount(form) {
      const q = form.querySelector('[name=quantity]'), p = form.querySelector('[name=unit_price]'), amt = form.querySelector('[name=claimed_amount]');
      const hint = document.createElement('div');
      hint.className = 'field-hint';
      amt.insertAdjacentElement('afterend', hint);
      const inst = form.querySelector('[name=instructed_by]');
      const instHint = document.createElement('div');
      instHint.className = 'field-hint';
      instHint.textContent = 'הוראה בכתב (הוראת שינוי, דף יומן, מייל) היא מה שמאפשר לגבות — צרפו אותה למטה';
      inst.insertAdjacentElement('afterend', instHint);
      const update = () => {
        const v = Number(q.value) * Number(p.value);
        if (!q.value || !p.value || !isFinite(v)) { hint.textContent = ''; return; }
        hint.textContent = `כמות × מחיר = ${fmtNum(v, 2)} ₪`;
        if (amt.value && amt.dataset.auto !== amt.value) return;          // typed by the user
        amt.value = String(Math.round(v * 100) / 100); amt.dataset.auto = amt.value;
      };
      q.addEventListener('input', update); p.addEventListener('input', update);
      this.update = update;
    },
    fill() { const a = document.querySelector('[name=claimed_amount]'); if (a) delete a.dataset.auto; this.update && this.update(); },
    collect(payload) {
      const today = xwToday();
      if (payload.status && payload.status !== 'טיוטה' && !payload.submitted_date) payload.submitted_date = today;
      if (['אושר', 'אושר חלקית', 'נדחה'].includes(payload.status) && !payload.decision_date) payload.decision_date = today;
      if (payload.status === 'אושר' && payload.approved_amount == null && payload.claimed_amount != null) payload.approved_amount = payload.claimed_amount;
      if (payload.status === 'אושר חלקית' && payload.approved_amount == null) return 'באישור חלקי יש לציין את הסכום שאושר';
      return null;
    },
  },
  onLoaded: renderXwSummary,
});

// Totals per direction: claimed, approved, waiting for a decision, paid.
function renderXwSummary(rows) {
  const card = document.getElementById('xwCard');
  card.hidden = !rows.length;
  if (!rows.length) return;
  const sum = (list, k) => list.reduce((a, r) => a + (Number(r[k]) || 0), 0);
  const block = dir => {
    const all = rows.filter(r => r.direction === dir && r.status !== 'טיוטה');
    const drafts = rows.filter(r => r.direction === dir && r.status === 'טיוטה').length;
    const pending = all.filter(r => XW_PENDING.includes(r.status));
    const approved = all.filter(r => ['אושר', 'אושר חלקית', 'שולם'].includes(r.status));
    const late = pending.filter(r => xwWaiting(r)).length;
    const noInst = rows.filter(r => r.direction === dir && !r.instructed_by).length;
    if (!all.length && !drafts) return '';
    return `<div class="xw-block xw-${dir === 'לגבייה' ? 'in' : 'out'}">
      <div class="xw-title">${dir === 'לגבייה' ? 'לגבייה — אנחנו דורשים' : 'לתשלום — דורשים מאיתנו'}</div>
      <dl>
        <div><dt>הוגש</dt><dd>${xwMoney(sum(all, 'claimed_amount')) || '0 ₪'}</dd></div>
        <div><dt>אושר</dt><dd>${xwMoney(sum(approved, 'approved_amount')) || '0 ₪'}</dd></div>
        <div><dt>ממתין להחלטה</dt><dd>${xwMoney(sum(pending, 'claimed_amount')) || '0 ₪'}<small>${xwCount(pending.length)}</small></dd></div>
        <div><dt>שולם</dt><dd>${xwMoney(sum(all.filter(r => r.status === 'שולם'), 'approved_amount')) || '0 ₪'}</dd></div>
      </dl>
      ${late ? `<p class="xw-warn">${late === 1 ? "חריג אחד ממתין" : late + " חריגים ממתינים"} להחלטה יותר מ-30 יום</p>` : ''}
      ${noInst ? `<p class="xw-warn">${xwCount(noInst)} בלי הוראה בכתב</p>` : ''}
      ${drafts ? `<p class="xw-note">${drafts === 1 ? "טיוטה אחת עוד לא הוגשה" : drafts + " טיוטות עוד לא הוגשו"}</p>` : ''}
    </div>`;
  };
  document.getElementById('xwSummary').innerHTML = block('לגבייה') + block('לתשלום');
}
</script>
</body>
</html>
