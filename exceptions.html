<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>חריגים / אי-התאמות | TADOK</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="application-name" content="TADOK">
<meta name="apple-mobile-web-app-title" content="TADOK">
<meta name="theme-color" content="#0E1A20">
<meta property="og:type" content="website">
<meta property="og:site_name" content="TADOK">
<meta property="og:title" content="TADOK — תיעוד, בקרת איכות ושליטה באתר הבנייה">
<meta property="og:description" content="פלטפורמה לניהול אתר בנייה: יציקות, ברזל, מסמכים, בקרת איכות ודוחות.">
<meta property="og:image" content="https://tadok.vercel.app/brand/og-image.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:locale" content="he_IL">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="css/styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<header class="app-header" id="app-header"></header>

<main class="page">
  <h1 class="page-title" id="pageTitle">חריגים / אי-התאמות</h1>

  <div class="stats-row" id="statsRow"></div>

  <div class="card">
    <div class="card-header">
      <h2>יומן חריגים</h2>
      <div class="header-actions">
        <button class="btn btn-primary" id="addBtn">+ הוספת חריג</button>
        <button class="btn btn-outline" id="filterToggle">סינון</button>
      </div>
    </div>

    <div class="filter-panel" id="filterPanel">
      <div class="filter-field"><label>מתאריך</label><input type="date" id="filterFrom"></div>
      <div class="filter-field"><label>עד תאריך</label><input type="date" id="filterTo"></div>
      <button class="btn btn-primary btn-sm" id="filterApply">החל סינון</button>
      <button class="btn btn-ghost btn-sm" id="filterClear">איפוס</button>
    </div>

    <div class="table-wrap">
      <table>
        <thead id="tableHead"></thead>
        <tbody id="tableBody">
          <tr class="empty-row"><td><div class="loading-overlay"><div class="spinner"></div></div></td></tr>
        </tbody>
      </table>
    </div>
  </div>
</main>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal">
    <h3 id="modalTitle">הוספת חריג</h3>
    <div id="formMsg" class="msg"></div>
    <form id="recordForm">
      <div class="form-grid" id="formGrid"></div>
      <div id="attachHost"></div>
      <div class="modal-actions">
        <button type="submit" class="btn btn-primary">שמירה</button>
        <button type="button" class="btn btn-outline" id="cancelBtn">ביטול</button>
      </div>
    </form>
    <button class="icon-btn modal-close" id="closeModalBtn" aria-label="סגירה"><svg class="ui-ico ui-ico-x" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
  </div>
</div>

<script src="js/supabase-client.js"></script>
<script src="js/app.js"></script>
<script src="js/documents.js"></script>
<script src="js/crud.js"></script>
<script>
initCrudPage({
  table: 'exceptions', icon: '⚠️',
  activePage: 'exceptions.html',
  title: 'חריגים / אי-התאמות',
  dateField: 'exception_date',
  orderBy: { column: 'exception_date', ascending: false },
  columns: [
    { key: 'exception_date', label: 'תאריך', type: 'date' },
    { key: 'category', label: 'קטגוריה', type: 'text' },
    { key: 'location', label: 'מיקום / אלמנט', type: 'text' },
    { key: 'description', label: 'תיאור', type: 'text' },
    { key: 'severity', label: 'חומרה', render: r => r.severity ? `<span class="ncr-sev ncr-sev-${r.severity}" title="${esc(NCR_SEVERITY[r.severity])}">${r.severity}</span>` : '' },
    { key: 'status', label: 'סטטוס', render: r => r.status ? `<span class="lic-status lic-status-${{ 'פתוח': 'fail', 'בטיפול': 'progress', 'נסגר': 'done' }[r.status] || 'open'}">${esc(r.status)}</span>` : '' },
    { key: 'planned_close_date', label: 'סגירה מתוכננת', render: ncrDueCell },
    { key: 'corrective_action', label: 'פעולה מתקנת', type: 'text' },
  ],
  formFields: [
    { key: 'exception_date', label: 'תאריך', type: 'date', required: true },
    { key: 'category', label: 'קטגוריה', type: 'select', required: true,
      options: ['יציקת בטון', 'ברזל', 'לוח\"דים', 'כמויות', 'בטיחות', 'תכנון', 'ביצוע', 'ספקים'] },
    { key: 'location', label: 'מיקום / אלמנט', type: 'text' },
    { key: 'description', label: 'תיאור החריג', type: 'textarea', full: true, required: true },
    { key: 'severity', label: 'חומרה (1 קלה · 2 תיקון/קיזוז באישור · 3 חובת תיקון)', type: 'select', options: ['1', '2', '3'], numeric: true },
    { key: 'cause', label: 'גורם', type: 'select', options: ['ספק', 'קבלן משנה', 'צוות הביצוע', 'תכנון'] },
    { key: 'status', label: 'סטטוס', type: 'select', required: true,
      options: ['פתוח', 'בטיפול', 'נסגר'] },
    { key: 'planned_close_date', label: 'תאריך סגירה מתוכנן (באישור מנהל הפרויקט)', type: 'date' },
    { key: 'closed_date', label: 'תאריך סגירה בפועל', type: 'date' },
    { key: 'corrective_action', label: 'פעולה מתקנת / מונעת', type: 'textarea', full: true },
    { key: 'notes', label: 'הערות / עדכונים', type: 'textarea', full: true },
  ],
  // the specification: severity, planned vs actual close date, corrective action; a closed
  // item gets its close date
  formExtension: {
    collect(payload) {
      if (payload.status === 'נסגר' && !payload.closed_date) payload.closed_date = new Date().toISOString().slice(0, 10);
      if (payload.severity === 3 && payload.status === 'נסגר' && !payload.corrective_action) return 'אי-התאמה בחומרה 3 נסגרת רק עם פעולה מתקנת';
      return null;
    },
  },
});
const NCR_SEVERITY = { 1: 'קלה — תיקון פשוט או קיזוז ללא תיקון', 2: 'בינונית — קיזוז או תיקון באישור', 3: 'חמורה — חובת תיקון, מעורבות מנהל הפרויקט / המתכנן' };
function ncrDueCell(r) {
  if (!r.planned_close_date) return '';
  const end = r.closed_date || new Date().toISOString().slice(0, 10);
  const late = Math.round((Date.parse(end) - Date.parse(r.planned_close_date)) / 86400000);
  const tag = late > 0 ? ` <span class="ncr-late">${r.closed_date ? 'נסגר' : ''} באיחור ${late} ימים</span>` : '';
  return esc(fmtDate(r.planned_close_date)) + tag;
}
</script>
</body>
</html>
