<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>דוחות | SGP</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.png">
<link rel="stylesheet" href="css/styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="js/pdf-report.js"></script>
</head>
<body>

<header class="app-header" id="app-header"></header>

<main class="page">
  <h1 class="page-title">דוחות</h1>

  <div class="card">
    <div class="card-header"><h2>סינון דוחות</h2></div>
    <div class="field full" style="margin-bottom:14px;">
      <label>אתרים</label>
      <div class="site-check-list" id="siteCheckList"></div>
    </div>
    <div class="form-grid">
      <div class="field"><label>מתאריך</label><input type="date" id="filterFrom"></div>
      <div class="field"><label>עד תאריך</label><input type="date" id="filterTo"></div>
    </div>
    <div style="margin-top:14px;font-size:12.5px;color:var(--steel);" id="filterSummary"></div>
  </div>

  <div class="card">
    <div class="card-header"><h2>ייצוא דוחות (PDF)</h2></div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;">
      <button class="btn btn-outline" data-export="concrete_pours">📄 יומני יציקות בטון</button>
      <button class="btn btn-outline" data-export="rebar_deliveries">📄 משלוחי ברזל</button>
      <button class="btn btn-outline" data-export="prestressed_slabs">📄 לוח״דים</button>
      <button class="btn btn-outline" data-export="price_quotes">📄 השוואת מחירים</button>
    </div>
  </div>

  <div class="card">
    <div class="card-header">
      <h2>מסמכים מצורפים</h2>
      <button class="btn btn-primary btn-sm" id="downloadAllDocs" style="display:none;">⬇️ הורד הכל</button>
    </div>
    <div id="docsList"><div class="loading-overlay"><div class="spinner"></div></div></div>
  </div>

  <div class="card">
    <div class="card-header">
      <h2>סיכום נפחי יציקות בטון לפי חודש</h2>
      <button class="btn btn-outline btn-sm" id="exportConcreteSummary">📄 PDF</button>
    </div>
    <div id="concreteSummary"><div class="loading-overlay"><div class="spinner"></div></div></div>
  </div>

  <div class="card">
    <div class="card-header">
      <h2>סיכום משקל ברזל לפי ספק</h2>
      <button class="btn btn-outline btn-sm" id="exportRebarSummary">📄 PDF</button>
    </div>
    <div id="rebarSummary"><div class="loading-overlay"><div class="spinner"></div></div></div>
  </div>
</main>

<script src="js/supabase-client.js"></script>
<script src="js/app.js"></script>
<script>
(async function () {
  const auth = await requireAuth('reports.html');
  if (!auth) return;
  const { profile, site } = auth;

  const isRestricted = profile.role === 'site_user';
  let sitesCache = [];
  const filterState = { siteIds: [], from: '', to: '' };
  let currentDocs = [];

  const REPORTS = {
    concrete_pours: {
      title: 'יומני יציקות בטון',
      dateField: 'pour_date',
      columns: [
        { key: 'pour_date', label: 'תאריך יציקה', type: 'date' },
        { key: 'element', label: 'אלמנט', type: 'text' },
        { key: 'concrete_grade', label: 'סוג בטון', type: 'text' },
        { key: 'volume_m3', label: 'נפח (מ\"ק)', type: 'number', digits: 2 },
        { key: 'lab_tested', label: 'נבדק במעבדה', type: 'boolean' },
        { key: 'cube_test_date', label: 'בדיקת קוביות', type: 'date' },
        { key: 'notes', label: 'הערות', type: 'text' },
      ],
    },
    rebar_deliveries: {
      title: 'משלוחי ברזל',
      dateField: 'delivery_date',
      columns: [
        { key: 'delivery_date', label: 'תאריך אספקה', type: 'date' },
        { key: 'supplier', label: 'ספק', type: 'text' },
        { key: 'diameter_mm', label: 'קוטר (מ\"מ)', type: 'number', digits: 0 },
        { key: 'weight_kg', label: 'משקל (ק\"ג)', type: 'number', digits: 0 },
        { key: 'delivery_note_number', label: 'מס\' תעודה', type: 'multiline' },
        { key: 'notes', label: 'הערות', type: 'text' },
      ],
    },
    prestressed_slabs: {
      title: 'לוח״דים',
      dateField: 'delivery_date',
      columns: [
        { key: 'supplier', label: 'ספק', type: 'text' },
        { key: 'quantity_m2', label: 'כמות (מ\"ר)', type: 'number', digits: 2 },
        { key: 'order_date', label: 'תאריך הזמנה', type: 'date' },
        { key: 'delivery_date', label: 'תאריך אספקה', type: 'date' },
        { key: 'delivery_note_number', label: 'מס\' תעודת משלוח', type: 'multiline' },
        { key: 'installed_date', label: 'תאריך התקנה', type: 'date' },
        { key: 'notes', label: 'הערות', type: 'text' },
      ],
    },
    price_quotes: {
      title: 'השוואת מחירים',
      dateField: 'quote_date',
      columns: [
        { key: 'material', label: 'חומר', type: 'text' },
        { key: 'supplier', label: 'ספק', type: 'text' },
        { key: 'unit_price', label: 'מחיר יחידה', type: 'number', digits: 2 },
        { key: 'unit', label: 'יחידה', type: 'text' },
        { key: 'quote_date', label: 'תאריך הצעה', type: 'date' },
        { key: 'notes', label: 'הערות', type: 'text' },
      ],
    },
  };

  function fmtCell(v, col) {
    if (col.type === 'docs') {
      if (!v || !v.length) return '—';
      return v.map(d => d.name || 'קובץ').join(', ');
    }
    if (v === null || v === undefined || v === '') return '—';
    if (col.type === 'boolean') return v ? 'כן' : 'לא';
    if (col.type === 'date') return fmtDate(v);
    if (col.type === 'number') return fmtNum(v, col.digits ?? 2);
    if (col.type === 'multiline') return String(v).split(/[\n,]+/).map(s => s.trim()).filter(Boolean).join('<br>');
    return String(v);
  }

  async function loadSitesForFilter() {
    if (isRestricted) {
      sitesCache = [site];
      filterState.siteIds = [site.id];
    } else {
      const { data, error } = await sb.from('sites').select('*').order('name');
      if (error) { toast('שגיאה בטעינת אתרים: ' + error.message, 'error'); return; }
      sitesCache = data || [];
      filterState.siteIds = sitesCache.map(s => s.id);
    }
    renderSiteChecks();
    updateFilterSummary();
  }

  function renderSiteChecks() {
    const host = document.getElementById('siteCheckList');
    host.innerHTML = sitesCache.map(s => `
      <label class="site-check ${filterState.siteIds.includes(s.id) ? 'checked' : ''}" data-site-id="${s.id}">
        <input type="checkbox" ${filterState.siteIds.includes(s.id) ? 'checked' : ''} ${isRestricted ? 'disabled' : ''}>
        ${s.name}
      </label>
    `).join('');

    host.querySelectorAll('.site-check').forEach(el => {
      const cb = el.querySelector('input');
      cb.addEventListener('change', () => {
        if (isRestricted) return;
        const id = el.dataset.siteId;
        if (cb.checked) {
          if (!filterState.siteIds.includes(id)) filterState.siteIds.push(id);
          el.classList.add('checked');
        } else {
          filterState.siteIds = filterState.siteIds.filter(x => x !== id);
          el.classList.remove('checked');
        }
        updateFilterSummary();
        refreshSummaries();
        loadDocuments();
      });
    });
  }

  function updateFilterSummary() {
    const names = sitesCache.filter(s => filterState.siteIds.includes(s.id)).map(s => s.name);
    const siteText = names.length ? names.join(', ') : 'לא נבחר אף אתר';
    const periodText = (filterState.from || filterState.to)
      ? `מ-${filterState.from ? fmtDate(filterState.from) : '—'} עד ${filterState.to ? fmtDate(filterState.to) : '—'}`
      : 'כל התקופה';
    document.getElementById('filterSummary').textContent = `הדוח יכלול: ${siteText} · ${periodText}`;
  }

  document.getElementById('filterFrom').addEventListener('change', e => {
    filterState.from = e.target.value;
    updateFilterSummary();
    refreshSummaries(); loadDocuments();
  });
  document.getElementById('filterTo').addEventListener('change', e => {
    filterState.to = e.target.value;
    updateFilterSummary();
    refreshSummaries(); loadDocuments();
  });

  function siteNameById(id) {
    return sitesCache.find(s => s.id === id)?.name || '—';
  }

  async function exportPdf(title, columns, rows, subtitleOverride) {
    const names = sitesCache.filter(s => filterState.siteIds.includes(s.id)).map(s => s.name);
    const periodText = (filterState.from || filterState.to)
      ? `${filterState.from ? fmtDate(filterState.from) : 'תחילת הפעילות'} — ${filterState.to ? fmtDate(filterState.to) : 'היום'}`
      : 'כל התקופה';
    await sgpExportPdf({
      title,
      columns,
      rows,
      siteNames: names,
      periodText,
      subtitle: subtitleOverride || '',
    });
  }

  document.querySelectorAll('[data-export]').forEach(btn => {
    btn.addEventListener('click', async () => {
      if (!filterState.siteIds.length) { toast('בחרו לפחות אתר אחד', 'error'); return; }
      btn.disabled = true;
      const key = btn.dataset.export;
      const cfg = REPORTS[key];
      let q = sb.from(key).select('*').in('site_id', filterState.siteIds);
      if (filterState.from) q = q.gte(cfg.dateField, filterState.from);
      if (filterState.to) q = q.lte(cfg.dateField, filterState.to);
      q = q.order(cfg.dateField, { ascending: false });
      const { data, error } = await q;
      if (error) { btn.disabled = false; toast('שגיאה: ' + error.message, 'error'); return; }

      let rows = data || [];
      let columns = cfg.columns;
      if (filterState.siteIds.length > 1) {
        rows = rows.map(r => ({ ...r, _site_name: siteNameById(r.site_id) }));
        columns = [{ key: '_site_name', label: 'אתר', type: 'text' }, ...cfg.columns];
      }

      if (rows.length) {
        const ids = rows.map(r => r.id);
        const { data: docs } = await sb.from('documents')
          .select('linked_record_id, file_path, file_name')
          .eq('linked_table', key)
          .in('linked_record_id', ids);
        if (docs && docs.length) {
          const byRecord = {};
          docs.forEach(d => {
            (byRecord[d.linked_record_id] ||= []).push({ name: d.file_name });
          });
          rows = rows.map(r => ({ ...r, _docs: byRecord[r.id] || [] }));
          columns = [...columns, { key: '_docs', label: 'מסמכים', type: 'docs' }];
        }
      }

      btn.disabled = false;
      await exportPdf(cfg.title, columns, rows);
    });
  });

  async function refreshSummaries() {
    if (!filterState.siteIds.length) {
      document.getElementById('concreteSummary').innerHTML = '<p style="color:var(--steel);">בחרו לפחות אתר אחד</p>';
      document.getElementById('rebarSummary').innerHTML = '<p style="color:var(--steel);">בחרו לפחות אתר אחד</p>';
      return;
    }

    let cq = sb.from('concrete_pours').select('pour_date, volume_m3, site_id').in('site_id', filterState.siteIds);
    if (filterState.from) cq = cq.gte('pour_date', filterState.from);
    if (filterState.to) cq = cq.lte('pour_date', filterState.to);
    const { data: pours } = await cq;
    const byMonth = {};
    (pours || []).forEach(p => {
      if (!p.pour_date) return;
      const month = p.pour_date.slice(0, 7);
      byMonth[month] = (byMonth[month] || 0) + (Number(p.volume_m3) || 0);
    });
    const months = Object.keys(byMonth).sort();
    document.getElementById('concreteSummary').innerHTML = months.length
      ? `<div class="table-wrap"><table><thead><tr><th>חודש</th><th>נפח כולל (מ\"ק)</th></tr></thead><tbody>${
          months.map(m => `<tr><td>${m}</td><td>${fmtNum(byMonth[m])}</td></tr>`).join('')
        }</tbody></table></div>`
      : '<p style="color:var(--steel);">אין נתונים תואמים לסינון</p>';

    document.getElementById('exportConcreteSummary').onclick = () => {
      exportPdf(
        'סיכום נפחי יציקות בטון לפי חודש',
        [{ key: 'month', label: 'חודש', type: 'text' }, { key: 'total', label: 'נפח כולל (מ\"ק)', type: 'number', digits: 2 }],
        months.map(m => ({ month: m, total: byMonth[m] })),
      );
    };

    let rq = sb.from('rebar_deliveries').select('supplier, weight_kg, delivery_date, site_id').in('site_id', filterState.siteIds);
    if (filterState.from) rq = rq.gte('delivery_date', filterState.from);
    if (filterState.to) rq = rq.lte('delivery_date', filterState.to);
    const { data: rebar } = await rq;
    const bySupplier = {};
    (rebar || []).forEach(r => {
      bySupplier[r.supplier] = (bySupplier[r.supplier] || 0) + (Number(r.weight_kg) || 0);
    });
    const suppliers = Object.keys(bySupplier).sort();
    document.getElementById('rebarSummary').innerHTML = suppliers.length
      ? `<div class="table-wrap"><table><thead><tr><th>ספק</th><th>משקל כולל (ק\"ג)</th></tr></thead><tbody>${
          suppliers.map(s => `<tr><td>${s}</td><td>${fmtNum(bySupplier[s], 0)}</td></tr>`).join('')
        }</tbody></table></div>`
      : '<p style="color:var(--steel);">אין נתונים תואמים לסינון</p>';

    document.getElementById('exportRebarSummary').onclick = () => {
      exportPdf(
        'סיכום משקל ברזל לפי ספק',
        [{ key: 'supplier', label: 'ספק', type: 'text' }, { key: 'total', label: 'משקל כולל (ק\"ג)', type: 'number', digits: 0 }],
        suppliers.map(s => ({ supplier: s, total: bySupplier[s] })),
      );
    };
  }

  const LINKED_TABLE_LABELS = {
    concrete_pours: 'יציקת בטון',
    rebar_deliveries: 'משלוח ברזל',
    prestressed_slabs: 'לוח״ד',
    price_quotes: 'הצעת מחיר',
  };

  function isImageFile(name) {
    return /\.(jpe?g|png|gif|webp|heic|bmp)$/i.test(name || '');
  }

  function openLightbox(url) {
    const overlay = document.createElement('div');
    overlay.style.cssText = 'position:fixed;inset:0;background:rgba(6,15,53,0.92);z-index:300;display:flex;align-items:center;justify-content:center;padding:20px;cursor:zoom-out;';
    overlay.innerHTML = `<img src="${url}" style="max-width:100%;max-height:100%;border-radius:8px;box-shadow:0 20px 60px rgba(0,0,0,0.5);">`;
    overlay.addEventListener('click', () => overlay.remove());
    document.body.appendChild(overlay);
  }

  async function downloadFile(url, fileName) {
    try {
      const res = await fetch(url);
      const blob = await res.blob();
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = fileName || 'file';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    } catch (err) {
      window.location.href = url;
    }
  }

  async function loadDocuments() {
    const host = document.getElementById('docsList');
    const downloadAllBtn = document.getElementById('downloadAllDocs');
    currentDocs = [];

    if (!filterState.siteIds.length) {
      host.innerHTML = '<p style="color:var(--steel);">בחרו לפחות אתר אחד</p>';
      downloadAllBtn.style.display = 'none';
      return;
    }
    let q = sb.from('documents').select('*').in('site_id', filterState.siteIds).order('created_at', { ascending: false }).limit(80);
    if (filterState.from) q = q.gte('created_at', filterState.from);
    if (filterState.to) q = q.lte('created_at', filterState.to + 'T23:59:59');
    const { data, error } = await q;
    if (error) { host.innerHTML = `<p style="color:var(--danger);">שגיאה: ${error.message}</p>`; downloadAllBtn.style.display = 'none'; return; }
    if (!data || !data.length) {
      host.innerHTML = '<p style="color:var(--steel);">אין מסמכים מצורפים בטווח שנבחר</p>';
      downloadAllBtn.style.display = 'none';
      return;
    }

    const resolved = await Promise.all(data.map(async d => {
      const { data: signed } = await sb.storage.from('documents').createSignedUrl(d.file_path, 3600);
      return { ...d, url: signed?.signedUrl || null };
    }));
    currentDocs = resolved.filter(d => d.url);

    downloadAllBtn.style.display = currentDocs.length ? 'inline-flex' : 'none';
    downloadAllBtn.textContent = `⬇️ הורד הכל (${currentDocs.length})`;

    host.innerHTML = `<div class="attach-list">${resolved.map((d, i) => {
      const typeLabel = LINKED_TABLE_LABELS[d.linked_table] || d.linked_table || '';
      if (!d.url) {
        return `<div class="attach-item"><span>${d.file_name} · ${typeLabel}</span><span style="color:var(--danger);font-size:12px;">שגיאה בטעינה</span></div>`;
      }
      if (isImageFile(d.file_name)) {
        return `<div class="attach-item">
          <span style="display:flex;align-items:center;gap:8px;min-width:0;">
            <img src="${d.url}" style="width:40px;height:40px;object-fit:cover;border-radius:6px;flex-shrink:0;">
            <span style="overflow:hidden;text-overflow:ellipsis;">${d.file_name}<br><span style="color:var(--steel);font-size:12px;">${typeLabel} · ${fmtDate(d.created_at)}</span></span>
          </span>
          <span style="display:flex;gap:6px;flex-shrink:0;">
            <button type="button" class="btn btn-sm btn-outline" data-view="${i}">צפייה</button>
            <button type="button" class="btn btn-sm btn-outline" data-dl="${i}">הורדה</button>
          </span>
        </div>`;
      }
      return `<div class="attach-item">
        <span style="overflow:hidden;text-overflow:ellipsis;">${d.file_name}<br><span style="color:var(--steel);font-size:12px;">${typeLabel} · ${fmtDate(d.created_at)}</span></span>
        <span style="display:flex;gap:6px;flex-shrink:0;">
          <a href="${d.url}" target="_blank" rel="noopener" class="btn btn-sm btn-outline">פתיחה</a>
          <button type="button" class="btn btn-sm btn-outline" data-dl="${i}">הורדה</button>
        </span>
      </div>`;
    }).join('')}</div>`;

    host.querySelectorAll('[data-view]').forEach(btn => {
      btn.addEventListener('click', () => openLightbox(resolved[Number(btn.dataset.view)].url));
    });
    host.querySelectorAll('[data-dl]').forEach(btn => {
      btn.addEventListener('click', () => {
        const d = resolved[Number(btn.dataset.dl)];
        if (d?.url) downloadFile(d.url, d.file_name);
      });
    });
  }

  document.getElementById('downloadAllDocs').addEventListener('click', async () => {
    if (!currentDocs.length) return;
    const btn = document.getElementById('downloadAllDocs');
    btn.disabled = true;
    btn.textContent = 'מוריד...';
    for (let i = 0; i < currentDocs.length; i++) {
      const d = currentDocs[i];
      await downloadFile(d.url, d.file_name);
      await new Promise(r => setTimeout(r, 400));
    }
    btn.disabled = false;
    btn.textContent = `⬇️ הורד הכל (${currentDocs.length})`;
    toast(`הורדו ${currentDocs.length} קבצים`, 'success');
  });

  await loadSitesForFilter();
  await refreshSummaries();
  await loadDocuments();
})();
</script>
</body>
</html>
