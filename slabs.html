<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>לוח״דים | SGP</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.png">
<link rel="stylesheet" href="css/styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<header class="app-header" id="app-header"></header>

<main class="page">
  <h1 class="page-title" id="pageTitle">לוח״דים</h1>

  <div class="stats-row" id="statsRow"></div>

  <div class="card">
    <div class="card-header">
      <h2>מעקב הזמנות והספקה — לוח״דים</h2>
      <div style="display:flex;gap:8px;">
        <button class="btn btn-primary" id="addBtn">+ הוספת רשומה</button>
        <button class="btn btn-outline" id="filterToggle">סינון</button>
      </div>
    </div>

    <div class="filter-panel" id="filterPanel">
      <div class="filter-field"><label>מתאריך</label><input type="date" id="filterFrom"></div>
      <div class="filter-field"><label>עד תאריך</label><input type="date" id="filterTo"></div>
      <button class="btn btn-primary btn-sm" id="filterApply">החל סינון</button>
      <button class="btn btn-ghost btn-sm" id="filterClear">איפוס</button>
    </div>

    <div class="table-wrap">
      <table>
        <thead id="tableHead"></thead>
        <tbody id="tableBody">
          <tr class="empty-row"><td><div class="loading-overlay"><div class="spinner"></div></div></td></tr>
        </tbody>
      </table>
    </div>
  </div>
</main>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal">
    <h3 id="modalTitle">הוספת רשומה</h3>
    <div id="formMsg" class="msg"></div>
    <form id="recordForm">
      <div class="form-grid" id="formGrid"></div>
      <div id="attachHost"></div>
      <div class="modal-actions">
        <button type="submit" class="btn btn-primary">שמירה</button>
        <button type="button" class="btn btn-outline" id="cancelBtn">ביטול</button>
      </div>
    </form>
    <button class="icon-btn" id="closeModalBtn" style="position:absolute;top:18px;left:18px;">✕</button>
  </div>
</div>

<script src="js/supabase-client.js"></script>
<script src="js/app.js"></script>
<script src="js/documents.js"></script>
<script src="js/crud.js"></script>
<script>
initCrudPage({
  table: 'prestressed_slabs', icon: '🏗️',
  activePage: 'slabs.html',
  title: 'לוח״דים',
  dateField: 'delivery_date',
  orderBy: { column: 'order_date', ascending: false },
  columns: [
    { key: 'order_number', label: 'מס\' הזמנה', type: 'text' },
    { key: 'order_date', label: 'תאריך הזמנה', type: 'date' },
    { key: 'delivery_date', label: 'תאריך אספקה', type: 'date' },
    { key: 'installed_date', label: 'תאריך הנחה', type: 'date' },
    { key: 'supplier', label: 'ספק', type: 'text' },
    { key: 'location', label: 'קומה / מיקום', type: 'text' },
    { key: 'plan_ref', label: 'מס\' תכנית', type: 'text' },
    { key: 'quantity_m2', label: 'סה\"כ מ\"ר', type: 'number', digits: 2 },
    { key: 'delivery_note_number', label: 'תעודת משלוח', type: 'text' },
    { key: 'notes', label: 'הערות', type: 'text' },
  ],
  formFields: [
    { key: 'order_number', label: 'מס\' הזמנה', type: 'text' },
    { key: 'order_date', label: 'תאריך הזמנה', type: 'date' },
    { key: 'delivery_date', label: 'תאריך אספקה', type: 'date' },
    { key: 'installed_date', label: 'תאריך הנחה / התקנה', type: 'date' },
    { key: 'supplier', label: 'ספק / יצרן', type: 'datalist', required: true,
      options: ['רמט טרום בע\"מ'] },
    { key: 'location', label: 'קומה / מיקום', type: 'datalist',
      options: ['מרתף -1', 'מרתף -2', 'קומה 0', 'קומה 1'] },
    { key: 'plan_ref', label: 'מס\' תכנית / מהדורה', type: 'text' },
    { key: 'quantity_m2', label: 'סה\"כ מ\"ר', type: 'number', step: '0.01' },
    { key: 'delivery_note_number', label: 'מס\' תעודת משלוח', type: 'text' },
    { key: 'notes', label: 'הערות / עדכונים', type: 'textarea', full: true },
  ],
});
</script>
</body>
</html>
