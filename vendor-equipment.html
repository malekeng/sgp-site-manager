<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ציוד | TADOK</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="application-name" content="TADOK">
<meta name="apple-mobile-web-app-title" content="TADOK">
<meta name="theme-color" content="#0E1A20">
<meta property="og:type" content="website">
<meta property="og:site_name" content="TADOK">
<meta property="og:title" content="TADOK — תיעוד, בקרת איכות ושליטה באתר הבנייה">
<meta property="og:description" content="פלטפורמה לניהול אתר בנייה: יציקות, ברזל, מסמכים, בקרת איכות ודוחות.">
<meta property="og:image" content="https://tadok.vercel.app/brand/og-image.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:locale" content="he_IL">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="css/styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<script src="js/ocr.js"></script>
</head>
<body>

<header class="app-header" id="app-header"></header>

<main class="page">
  <h1 class="page-title" id="pageTitle">ציוד</h1>

  <div class="stats-row" id="statsRow"></div>

  <div class="card">
    <div class="card-header">
      <h2>הגשת ואישור ציוד לאתר</h2>
      <div class="header-actions">
        <button class="btn btn-primary" id="addBtn">+ הוספת ציוד</button>
        <button class="btn btn-outline" id="filterToggle">סינון</button>
      </div>
    </div>

    <div class="filter-panel" id="filterPanel">
      <div class="filter-field"><label>מתאריך</label><input type="date" id="filterFrom"></div>
      <div class="filter-field"><label>עד תאריך</label><input type="date" id="filterTo"></div>
      <button class="btn btn-primary btn-sm" id="filterApply">החל סינון</button>
      <button class="btn btn-ghost btn-sm" id="filterClear">איפוס</button>
    </div>

    <div class="table-wrap">
      <table>
        <thead id="tableHead"></thead>
        <tbody id="tableBody">
          <tr class="empty-row"><td><div class="loading-overlay"><div class="spinner"></div></div></td></tr>
        </tbody>
      </table>
    </div>
  </div>
</main>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal">
    <h3 id="modalTitle">הוספת ציוד</h3>
    <div id="formMsg" class="msg"></div>
    <form id="recordForm">
      <div class="form-grid" id="formGrid"></div>
      <div id="attachHost"></div>
      <div class="modal-actions">
        <button type="submit" class="btn btn-primary">שמירה</button>
        <button type="button" class="btn btn-outline" id="cancelBtn">ביטול</button>
      </div>
    </form>
    <button class="icon-btn modal-close" id="closeModalBtn" aria-label="סגירה"><svg class="ui-ico ui-ico-x" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
  </div>
</div>

<script src="js/supabase-client.js"></script>
<script src="js/policies.js"></script>
<script src="js/app.js"></script>
<script src="js/documents.js"></script>
<script src="js/doc-insights.js"></script>
<script src="js/crud.js"></script>
<script>
const EQUIP_INSPECTION_MONTHS = { 'עגורן צריח': 6, 'במת הרמה': 6, 'אביזרי הרמה': 6, 'ציוד הרמה': 6, 'מנוף נייד / מכונת הרמה': 14 };
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
initCrudPage({
  table: 'vendor_submissions', docInsights: true,
  staticFilter: { column: 'submission_type', value: 'equipment' },
  icon: '🛠️',
  activePage: 'vendor-equipment.html',
  title: 'ציוד',
  dateField: 'submission_date',
  orderBy: { column: 'submission_date', ascending: false },
  columns: [
    { key: 'name', label: 'שם / סוג ציוד', type: 'text' },
    { key: 'category', label: 'קטגוריה', type: 'text' },
    { key: 'reg_number', label: 'מס\' רישוי / סידורי', type: 'text' },
    { key: 'approval_status', label: 'סטטוס אישור', type: 'text' },
    { key: 'inspection_date', label: 'נבדק', type: 'date' },
    { key: 'valid_until', label: 'תוקף בדיקה תקופתית', type: 'date' },
    { key: 'submission_date', label: 'תאריך הגשה', type: 'date' },
  ],
  formFields: [
    { key: 'name', label: 'שם / סוג ציוד', type: 'text', required: true },
    { key: 'category', label: 'קטגוריה', type: 'select',
      options: ['עגורן צריח', 'מנוף נייד / מכונת הרמה', 'במת הרמה', 'אביזרי הרמה', 'מנוף', 'פיגום', 'גנרטור', 'מכולה', 'ציוד הרמה', 'רכב עבודה', 'שונות'] },
    { key: 'reg_number', label: 'מס\' רישוי / סידורי', type: 'text' },
    { key: 'contact_person', label: 'ספק / בעלים', type: 'text' },
    { key: 'phone', label: 'טלפון', type: 'text' },
    { key: 'approval_status', label: 'סטטוס אישור', type: 'select', options: ['ממתין לאישור', 'מאושר', 'נדחה'] },
    { key: 'inspection_date', label: 'תאריך הבדיקה האחרונה (תסקיר)', type: 'date' },
    { key: 'valid_until', label: 'תוקף הבדיקה התקופתית', type: 'date' },
    { key: 'submission_date', label: 'תאריך הגשה', type: 'date', required: true },
    { key: 'notes', label: 'הערות', type: 'textarea', full: true },
  ],
  // The validity follows from the last inspection and the kind of equipment (פקודת הבטיחות
  // בעבודה: lifting machines every 14 months; tower cranes, lifting platforms and lifting
  // accessories every 6). Filled in for the user; a date they typed themselves is kept.
  formExtension: {
    mount(form) {
      const cat = form.querySelector('[name=category]'), insp = form.querySelector('[name=inspection_date]'), until = form.querySelector('[name=valid_until]');
      const hint = document.createElement('div');
      hint.className = 'field-hint';
      until.insertAdjacentElement('afterend', hint);
      const update = () => {
        const months = EQUIP_INSPECTION_MONTHS[cat.value];
        hint.textContent = months ? `בדיקה כל ${months} חודשים לסוג הציוד הזה` : (cat.value === 'מנוף' ? 'לחישוב אוטומטי בחרו "עגורן צריח" (6 ח׳) או "מנוף נייד" (14 ח׳)' : '');
        if (!months || !insp.value) return;
        if (until.value && until.dataset.auto !== until.value) return;       // typed by the user
        const [y, m, d] = insp.value.split('-').map(Number);
        const due = new Date(Date.UTC(y, m - 1 + months, d)).toISOString().slice(0, 10);
        until.value = due; until.dataset.auto = due;
      };
      cat.addEventListener('change', update); insp.addEventListener('change', update);
      this.update = update;
    },
    fill() { const until = document.querySelector('[name=valid_until]'); if (until) delete until.dataset.auto; this.update && this.update(); },
  },
});
</script>
</body>
</html>
