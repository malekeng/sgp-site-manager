<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>יומני יציקות בטון | TADOK</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="application-name" content="TADOK">
<meta name="apple-mobile-web-app-title" content="TADOK">
<meta name="theme-color" content="#0E1A20">
<meta property="og:type" content="website">
<meta property="og:site_name" content="TADOK">
<meta property="og:title" content="TADOK — תיעוד, בקרת איכות ושליטה באתר הבנייה">
<meta property="og:description" content="פלטפורמה לניהול אתר בנייה: יציקות, ברזל, מסמכים, בקרת איכות ודוחות.">
<meta property="og:image" content="https://tadok.vercel.app/brand/og-image.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:locale" content="he_IL">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="css/styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<script src="js/ocr.js"></script>
<style>
.ocr-zone { border: 1.5px dashed var(--border); border-radius: 10px; padding: 22px; text-align: center; cursor: pointer; margin-bottom: 16px; }
.ocr-zone:hover, .ocr-zone.dragover { border-color: var(--green); background: rgba(34, 216, 107,0.06); }
.ocr-progress { display: none; align-items: center; gap: 10px; margin-bottom: 16px; font-size: 13px; color: var(--steel); }
.ocr-progress.show { display: flex; }
</style>
</head>
<body>

<header class="app-header" id="app-header"></header>

<main class="page">
  <h1 class="page-title" id="pageTitle">יומני יציקות בטון</h1>

  <div class="stats-row" id="statsRow"></div>

  <div class="card">
    <div class="card-header">
      <h2>טבלת ריכוז יציקות בטון</h2>
      <div class="header-actions">
        <button class="btn btn-primary" id="addBtn">+ הוספת רשומה</button>
        <button class="btn btn-outline" id="filterToggle">סינון</button>
      </div>
    </div>

    <div class="filter-panel" id="filterPanel">
      <div class="filter-field"><label>מתאריך</label><input type="date" id="filterFrom"></div>
      <div class="filter-field"><label>עד תאריך</label><input type="date" id="filterTo"></div>
      <button class="btn btn-primary btn-sm" id="filterApply">החל סינון</button>
      <button class="btn btn-ghost btn-sm" id="filterClear">איפוס</button>
    </div>

    <div class="table-wrap">
      <table>
        <thead id="tableHead"></thead>
        <tbody id="tableBody">
          <tr class="empty-row"><td><div class="loading-overlay"><div class="spinner"></div></div></td></tr>
        </tbody>
      </table>
    </div>
  </div>
</main>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal">
    <h3 id="modalTitle">הוספת רשומה</h3>

    <div class="ocr-zone" id="ocrZone">
      <img class="zone-ico" src="icons/nav/scan.webp" alt="" aria-hidden="true" width="44" height="44"><div>גררו כאן תעודת משלוח / דוח מעבדה (תמונה או PDF) למילוי אוטומטי</div>
      <div style="font-size:11px;color:var(--steel);margin-top:4px;">זיהוי טקסט אוטומטי — בדקו את התוצאה ותקנו ידנית לפני שמירה</div>
      <input type="file" id="ocrInput" accept="image/*,.pdf" style="display:none;">
    </div>
    <div class="ocr-progress" id="ocrProgress"><div class="spinner"></div><span id="ocrProgressText">מעבד...</span></div>
    <details id="ocrRawWrap" style="display:none;margin-bottom:16px;">
      <summary style="cursor:pointer;font-size:12px;color:var(--steel);font-weight:600;"><svg class="ui-ico ui-ico-file-text" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z"/><path d="M14 2v5a1 1 0 0 0 1 1h5"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></svg> טקסט גולמי שזוהה (למקרה שלא כל השדות התמלאו)</summary>
      <div id="ocrRawText" style="max-height:140px;overflow-y:auto;background:var(--bg);border-radius:var(--radius-sm);padding:10px 12px;font-size:11.5px;white-space:pre-wrap;margin-top:6px;direction:rtl;text-align:right;unicode-bidi:plaintext;"></div>
    </details>
    <div id="ocrAttachChoice" style="display:none;background:var(--bg);border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:16px;">
      <div style="font-size:12.5px;font-weight:700;color:var(--navy);margin-bottom:8px;">לאיזה סוג מסמך שייך הקובץ שנסרק?</div>
      <div class="header-actions">
        <button type="button" class="btn btn-sm btn-outline" id="ocrAttachAsDeliveryNote"><svg class="ui-ico ui-ico-paperclip" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m16 6-8.414 8.586a2 2 0 0 0 2.829 2.829l8.414-8.586a4 4 0 1 0-5.657-5.657l-8.379 8.551a6 6 0 1 0 8.485 8.485l8.379-8.551"/></svg> תעודת משלוח</button>
        <button type="button" class="btn btn-sm btn-outline" id="ocrAttachAsLabReport"><svg class="ui-ico ui-ico-paperclip" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m16 6-8.414 8.586a2 2 0 0 0 2.829 2.829l8.414-8.586a4 4 0 1 0-5.657-5.657l-8.379 8.551a6 6 0 1 0 8.485 8.485l8.379-8.551"/></svg> דוח מעבדה</button>
        <button type="button" class="btn btn-sm btn-ghost" id="ocrAttachSkip">לא לצרף</button>
      </div>
    </div>

    <div id="formMsg" class="msg"></div>
    <form id="recordForm">
      <div class="form-grid" id="formGrid"></div>
      <div id="attachHost"></div>
      <div class="modal-actions">
        <button type="submit" class="btn btn-primary">שמירה</button>
        <button type="button" class="btn btn-outline" id="cancelBtn">ביטול</button>
      </div>
    </form>
    <button class="icon-btn modal-close" id="closeModalBtn" aria-label="סגירה"><svg class="ui-ico ui-ico-x" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
  </div>
</div>

<script src="js/supabase-client.js"></script>
<script src="js/app.js"></script>
<script src="js/documents.js"></script>
<script src="js/crud.js"></script>
<script>
initCrudPage({
  table: 'concrete_pours', icon: '🧱',
  activePage: 'concrete.html',
  title: 'יומני יציקות בטון',
  dateField: 'pour_date',
  orderBy: { column: 'pour_date', ascending: false },
  columns: [
    { key: 'pour_date', label: 'תאריך', type: 'date' },
    { key: 'location', label: 'קומה / מיקום', type: 'text' },
    { key: 'element', label: 'אלמנט', type: 'text' },
    { key: 'concrete_grade', label: 'סוג בטון', type: 'text' },
    { key: 'volume_m3', label: 'כמות (מ"ק)', type: 'number', digits: 1 },
    { key: 'area_m2', label: 'שטח (מ"ר)', type: 'number', digits: 2 },
    { key: 'pour_method', label: 'אופן יציקה', type: 'text' },
    { key: 'supplier', label: 'ספק', type: 'text' },
    { key: 'delivery_note_number', label: 'תעודת משלוח', type: 'multiline' },
    { key: 'lab_test_number', label: 'מס\' בדיקה', type: 'text' },
    { key: 'strength_7d', label: 'חוזק 7י', type: 'number', digits: 1 },
    { key: 'strength_28d', label: 'חוזק 28י', type: 'number', digits: 1 },
    { key: 'notes', label: 'הערות', type: 'text' },
  ],
  formFields: [
    { key: 'pour_date', label: 'תאריך יציקה', type: 'date', required: true },
    { key: 'location', label: 'קומה / מיקום', type: 'datalist',
      options: ['מרתף -1', 'מרתף -2', 'גרעין 5', 'בין הלוח\"דים', 'תקרת לוח\"דים'] },
    { key: 'element', label: 'אלמנט', type: 'select', required: true,
      options: ['יסודות', 'רצפה', 'קיר', 'קיר דיפון', 'עמודים', 'קורות', 'תקרה', 'מדרגות', 'ממ\"ד', 'השלמה', 'טופינג/החלקה'] },
    { key: 'concrete_grade', label: 'סוג בטון מתוכנן', type: 'select',
      options: ['ב-20', 'ב-25', 'ב-30', 'ב-40', 'ב-50'] },
    { key: 'volume_m3', label: 'כמות בטון (מ"ק)', type: 'number', step: '0.1' },
    { key: 'area_m2', label: 'שטח (מ"ר)', type: 'number', step: '0.01' },
    { key: 'pour_method', label: 'אופן יציקה', type: 'select',
      options: ['דוד', 'משאבה', 'אחר'] },
    { key: 'supplier', label: 'ספק בטון', type: 'datalist',
      options: ['א.מואסי', 'רדימיקס', 'הנקל'] },
    { key: 'delivery_note_number', label: 'מס\' תעודת משלוח (שורה לכל מספר)', type: 'textarea' },
    { key: 'lab_test_number', label: 'מס\' בדיקה (מעבדה)', type: 'text' },
    { key: 'lab_tested', label: 'נבדק במעבדה', type: 'boolean' },
    { key: 'cube_test_date', label: 'תאריך בדיקת קוביות', type: 'date' },
    { key: 'strength_7d', label: 'חוזק בטון 7 יום (מגפ\"ס)', type: 'number', step: '0.1' },
    { key: 'strength_28d', label: 'חוזק בטון 28 יום (מגפ\"ס)', type: 'number', step: '0.1' },
    { key: 'notes', label: 'הערות', type: 'textarea', full: true },
  ],
});

pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';

const ocrZone = document.getElementById('ocrZone');
const ocrInput = document.getElementById('ocrInput');
const ocrProgress = document.getElementById('ocrProgress');
const ocrProgressText = document.getElementById('ocrProgressText');

ocrZone.addEventListener('click', () => ocrInput.click());
ocrZone.addEventListener('dragover', e => { e.preventDefault(); ocrZone.classList.add('dragover'); });
ocrZone.addEventListener('dragleave', () => ocrZone.classList.remove('dragover'));
ocrZone.addEventListener('drop', e => {
  e.preventDefault();
  ocrZone.classList.remove('dragover');
  if (e.dataTransfer.files[0]) handleOcrFile(e.dataTransfer.files[0]);
});
ocrInput.addEventListener('change', () => {
  if (ocrInput.files[0]) handleOcrFile(ocrInput.files[0]);
  ocrInput.value = '';
});

let lastOcrFile = null;

async function handleOcrFile(file) {
  lastOcrFile = file;
  document.getElementById('ocrAttachChoice').style.display = 'none';
  document.getElementById('ocrRawWrap').style.display = 'none';
  ocrProgress.classList.add('show');
  ocrProgressText.textContent = 'טוען קובץ...';
  try {
    const doc = await sgpReadDocument(file, { onProgress: t => { ocrProgressText.textContent = t; } });
    document.getElementById('ocrRawText').textContent = sgpDocumentRawText(doc);
    document.getElementById('ocrRawWrap').style.display = 'block';

    const parsed = sgpParse.concrete(doc.text);
    const form = document.getElementById('recordForm');
    if (parsed.supplier) form.querySelector('[name=supplier]').value = parsed.supplier;
    if (parsed.concrete_grade) form.querySelector('[name=concrete_grade]').value = parsed.concrete_grade;
    if (parsed.volume_m3) form.querySelector('[name=volume_m3]').value = parsed.volume_m3;
    if (parsed.delivery_note_number) form.querySelector('[name=delivery_note_number]').value = parsed.delivery_note_number;
    if (parsed.lab_test_number) form.querySelector('[name=lab_test_number]').value = parsed.lab_test_number;
    if (parsed.strength_7d) form.querySelector('[name=strength_7d]').value = parsed.strength_7d;
    if (parsed.strength_28d) form.querySelector('[name=strength_28d]').value = parsed.strength_28d;
    if (parsed.location) form.querySelector('[name=location]').value = parsed.location;
    if (parsed.element) form.querySelector('[name=element]').value = parsed.element;
    if (parsed.pour_date) form.querySelector('[name=pour_date]').value = parsed.pour_date;
    if (parsed.lab_test_number) form.querySelector('[name=lab_tested]').value = 'כן';

    toast(parsed._summary ? `${parsed._summary} — בדקו ותקנו לפני שמירה` : 'הזיהוי הושלם — בדקו ותקנו את השדות לפני שמירה', 'success');
    document.getElementById('ocrAttachChoice').style.display = 'block';
  } catch (err) {
    console.error(err);
    toast('שגיאה בזיהוי הטקסט: ' + err.message, 'error');
  } finally {
    ocrProgress.classList.remove('show');
  }
}

function attachOcrFileAs(docType) {
  if (!lastOcrFile) return;
  const widget = (window.sgpAttachWidgetsByType && window.sgpAttachWidgetsByType[docType])
    || (window.sgpAttachWidgetsByType && window.sgpAttachWidgetsByType.default);
  if (!widget) { toast('שגיאה: לא נמצא אזור צירוף מתאים', 'error'); return; }
  widget.addFile(lastOcrFile, docType);
  toast('הקובץ צורף', 'success');
  document.getElementById('ocrAttachChoice').style.display = 'none';
  lastOcrFile = null;
}

document.getElementById('ocrAttachAsDeliveryNote').addEventListener('click', () => attachOcrFileAs('delivery_note'));
document.getElementById('ocrAttachAsLabReport').addEventListener('click', () => attachOcrFileAs('lab_test'));
document.getElementById('ocrAttachSkip').addEventListener('click', () => {
  lastOcrFile = null;
  document.getElementById('ocrAttachChoice').style.display = 'none';
});
</script>
</body>
</html>
