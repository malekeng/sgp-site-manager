<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>יומני יציקות בטון | SGP</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.png">
<link rel="stylesheet" href="css/styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<header class="app-header" id="app-header"></header>

<main class="page">
  <h1 class="page-title" id="pageTitle">יומני יציקות בטון</h1>

  <div class="stats-row" id="statsRow"></div>

  <div class="card">
    <div class="card-header">
      <h2>יומני יציקות בטון</h2>
      <div style="display:flex;gap:8px;">
        <button class="btn btn-primary" id="addBtn">+ הוספת רשומה</button>
        <button class="btn btn-outline" id="filterToggle">סינון</button>
      </div>
    </div>

    <div class="filter-panel" id="filterPanel">
      <div class="filter-field"><label>מתאריך</label><input type="date" id="filterFrom"></div>
      <div class="filter-field"><label>עד תאריך</label><input type="date" id="filterTo"></div>
      <button class="btn btn-primary btn-sm" id="filterApply">החל סינון</button>
      <button class="btn btn-ghost btn-sm" id="filterClear">איפוס</button>
    </div>

    <div class="table-wrap">
      <table>
        <thead id="tableHead"></thead>
        <tbody id="tableBody">
          <tr class="empty-row"><td><div class="loading-overlay"><div class="spinner"></div></div></td></tr>
        </tbody>
      </table>
    </div>
  </div>
</main>

<!-- Add/Edit modal -->
<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal">
    <h3 id="modalTitle">הוספת רשומה</h3>
    <div id="formMsg" class="msg"></div>
    <form id="recordForm">
      <div class="form-grid" id="formGrid"></div>
      <div id="attachHost"></div>
      <div class="modal-actions">
        <button type="submit" class="btn btn-primary">שמירה</button>
        <button type="button" class="btn btn-outline" id="cancelBtn">ביטול</button>
      </div>
    </form>
    <button class="icon-btn" id="closeModalBtn" style="position:absolute;top:18px;left:18px;">✕</button>
  </div>
</div>

<script src="js/supabase-client.js"></script>
<script src="js/app.js"></script>
<script src="js/documents.js"></script>
<script src="js/crud.js"></script>
<script>
initCrudPage({
  table: 'concrete_pours', icon: '🧱',
  activePage: 'concrete.html',
  title: 'יומני יציקות בטון',
  dateField: 'pour_date',
  orderBy: { column: 'pour_date', ascending: false },
  columns: [
    { key: 'pour_date', label: 'תאריך יציקה', type: 'date' },
    { key: 'element', label: 'אלמנט', type: 'text' },
    { key: 'concrete_grade', label: 'סוג בטון', type: 'text' },
    { key: 'volume_m3', label: 'נפח (מ"ק)', type: 'number', digits: 2 },
    { key: 'lab_tested', label: 'נבדק במעבדה', type: 'boolean' },
    { key: 'cube_test_date', label: 'תאריך בדיקת קוביות', type: 'date' },
    { key: 'notes', label: 'הערות', type: 'text' },
  ],
  formFields: [
    { key: 'pour_date', label: 'תאריך יציקה', type: 'date', required: true },
    { key: 'element', label: 'אלמנט', type: 'select', required: true,
      options: ['יסודות', 'רצפה', 'קיר', 'קיר תומך', 'עמוד', 'קורה', 'תקרה', 'מדרגות', 'ממ"ד', 'אחר'] },
    { key: 'concrete_grade', label: 'סוג בטון', type: 'select',
      options: ['ב-20', 'ב-25', 'ב-30', 'ב-40', 'ב-50'] },
    { key: 'volume_m3', label: 'נפח (מ"ק)', type: 'number', step: '0.01' },
    { key: 'lab_tested', label: 'נבדק במעבדה', type: 'boolean' },
    { key: 'cube_test_date', label: 'תאריך בדיקת קוביות', type: 'date' },
    { key: 'notes', label: 'הערות', type: 'textarea', full: true },
  ],
});
</script>
</body>
</html>
