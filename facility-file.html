<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>תיק מתקן / טופס 4 | TADOK</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="application-name" content="TADOK">
<meta name="apple-mobile-web-app-title" content="TADOK">
<meta name="theme-color" content="#0E1A20">
<meta property="og:type" content="website">
<meta property="og:site_name" content="TADOK">
<meta property="og:title" content="TADOK — תיעוד, בקרת איכות ושליטה באתר הבנייה">
<meta property="og:description" content="פלטפורמה לניהול אתר בנייה: יציקות, ברזל, מסמכים, בקרת איכות ודוחות.">
<meta property="og:image" content="https://tadok.vercel.app/brand/og-image.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:locale" content="he_IL">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="css/styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<header class="app-header" id="app-header"></header>

<main class="page">
  <h1 class="page-title" id="pageTitle">תיק מתקן / טופס 4</h1>

  <div class="stats-row" id="statsRow"></div>

  <div class="card">
    <div class="card-header">
      <h2>רשימת אישורים ומסמכים לתיק המתקן</h2>
      <div class="header-actions">
        <button class="btn btn-primary" id="addBtn">+ הוספת פריט</button>
        <button class="btn btn-outline" id="filterToggle">סינון</button>
      </div>
    </div>

    <div class="filter-panel" id="filterPanel">
      <div class="filter-field"><label>מתאריך</label><input type="date" id="filterFrom"></div>
      <div class="filter-field"><label>עד תאריך</label><input type="date" id="filterTo"></div>
      <button class="btn btn-primary btn-sm" id="filterApply">החל סינון</button>
      <button class="btn btn-ghost btn-sm" id="filterClear">איפוס</button>
    </div>

    <div class="table-wrap">
      <table>
        <thead id="tableHead"></thead>
        <tbody id="tableBody">
          <tr class="empty-row"><td><div class="loading-overlay"><div class="spinner"></div></div></td></tr>
        </tbody>
      </table>
    </div>
  </div>
</main>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal">
    <h3 id="modalTitle">הוספת פריט</h3>
    <div id="formMsg" class="msg"></div>
    <form id="recordForm">
      <div class="form-grid" id="formGrid"></div>
      <div id="attachHost"></div>
      <div class="modal-actions">
        <button type="submit" class="btn btn-primary">שמירה</button>
        <button type="button" class="btn btn-outline" id="cancelBtn">ביטול</button>
      </div>
    </form>
    <button class="icon-btn modal-close" id="closeModalBtn" aria-label="סגירה"><svg class="ui-ico ui-ico-x" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
  </div>
</div>

<script src="js/supabase-client.js"></script>
<script src="js/app.js"></script>
<script src="js/documents.js"></script>
<script src="js/crud.js"></script>
<script>
initCrudPage({
  table: 'facility_file_items',
  icon: '📜',
  activePage: 'facility-file.html',
  title: 'תיק מתקן / טופס 4',
  dateField: 'due_date',
  orderBy: { column: 'due_date', ascending: true },
  columns: [
    { key: 'item_name', label: 'שם הפריט / אישור נדרש', type: 'text' },
    { key: 'category', label: 'קטגוריה', type: 'text' },
    { key: 'responsible', label: 'גורם אחראי', type: 'text' },
    { key: 'status', label: 'סטטוס', type: 'text' },
    { key: 'due_date', label: 'תאריך יעד', type: 'date' },
    { key: 'completed_date', label: 'תאריך השלמה', type: 'date' },
  ],
  formFields: [
    { key: 'item_name', label: 'שם הפריט / אישור נדרש', type: 'text', required: true,
      placeholder: 'לדוגמה: אישור כיבוי אש, אישור נגישות, בדיקת מעלית...' },
    { key: 'category', label: 'קטגוריה', type: 'select',
      options: ['רשויות ואישורים', 'בדיקות מכון', 'מסמכי תכנון', 'חיבורי תשתית'] },
    { key: 'responsible', label: 'גורם אחראי', type: 'text' },
    { key: 'status', label: 'סטטוס', type: 'select', options: ['פתוח', 'בטיפול', 'הושלם'] },
    { key: 'due_date', label: 'תאריך יעד', type: 'date' },
    { key: 'completed_date', label: 'תאריך השלמה', type: 'date' },
    { key: 'notes', label: 'הערות', type: 'textarea', full: true },
  ],
});
</script>
</body>
</html>
