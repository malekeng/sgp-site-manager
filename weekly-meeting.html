<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>סיכומי ישיבות | TADOK</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="application-name" content="TADOK">
<meta name="apple-mobile-web-app-title" content="TADOK">
<meta name="theme-color" content="#0E1A20">
<meta property="og:type" content="website">
<meta property="og:site_name" content="TADOK">
<meta property="og:title" content="TADOK — תיעוד, בקרת איכות ושליטה באתר הבנייה">
<meta property="og:description" content="פלטפורמה לניהול אתר בנייה: יציקות, ברזל, מסמכים, בקרת איכות ודוחות.">
<meta property="og:image" content="https://tadok.vercel.app/brand/og-image.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:locale" content="he_IL">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="css/styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="js/pdf-report.js"></script>
<script src="js/excel-report.js"></script>
<style>
#meetingsList .attach-list { position: relative; gap: 14px; }
#meetingsList .attach-list::before {
  content: '';
  position: absolute; top: 6px; bottom: 6px; right: 15px;
  width: 2px;
  background: linear-gradient(var(--green) 0%, var(--border) 12%, var(--border) 88%, transparent 100%);
}
#meetingsList .attach-item {
  position: relative;
  margin-right: 34px;
  background: var(--sheet);
  border: 1px solid var(--border);
}
#meetingsList .attach-item::before {
  content: '';
  position: absolute; top: 16px; right: -26px;
  width: 11px; height: 11px; border-radius: 50%;
  background: var(--sheet);
  border: 2.5px solid var(--green);
  box-shadow: 0 0 0 4px var(--bg);
}
</style>
</head>
<body>

<header class="app-header" id="app-header"></header>

<main class="page">
  <h1 class="page-title">סיכומי ישיבות שבועיות</h1>

  <div class="card">
    <div class="card-header">
      <h2>יומן ישיבות</h2>
      <div class="header-actions">
        <button class="btn btn-primary" id="addBtn">+ סיכום ישיבה</button>
        <button class="btn btn-outline" id="exportAllBtn"><img class="ico3d" src="icons/nav/pdf.webp" alt="" aria-hidden="true" width="20" height="20">PDF</button>
        <button class="btn btn-outline" id="exportAllXlsxBtn"><img class="ico3d" src="icons/nav/excel.webp" alt="" aria-hidden="true" width="20" height="20">Excel</button>
      </div>
    </div>
    <div id="meetingsList"><div class="loading-overlay"><div class="spinner"></div></div></div>
  </div>
</main>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal">
    <button class="icon-btn modal-close" id="closeModalBtn" aria-label="סגירה"><svg class="ui-ico ui-ico-x" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
    <h3 id="modalTitle">סיכום ישיבה</h3>
    <div id="formMsg" class="msg"></div>
    <form id="recordForm">
      <div class="form-grid">
        <div class="field"><label>תאריך *</label><input type="date" name="meeting_date" required></div>
        <div class="field"><label>משתתפים</label><input type="text" name="attendees" placeholder="שמות המשתתפים, מופרדים בפסיק"></div>
        <div class="field full"><label>סיכום *</label><textarea name="summary" rows="6" required placeholder="נושאים שנדונו, החלטות, משימות שנקבעו..."></textarea></div>
        <div class="field full" id="meetingOpenItems"></div>
        <div class="field full">
          <label>משימות מהישיבה — מי · מה · עד מתי</label>
          <div id="meetingTasks" class="mt-list"></div>
          <button type="button" class="btn btn-sm btn-outline" id="addMeetingTask" style="justify-self:start;margin-top:6px;">+ משימה</button>
          <div class="field-hint">כל משימה נשמרת כמשימה אמיתית בעמוד המשימות, מקושרת לישיבה.</div>
        </div>
      </div>
      <div class="modal-actions">
        <button type="submit" class="btn btn-primary">שמירה</button>
        <button type="button" class="btn btn-outline" id="cancelBtn">ביטול</button>
        <button type="button" class="btn btn-danger" id="deleteBtn" style="display:none;margin-right:auto;">מחיקה</button>
      </div>
    </form>
  </div>
</div>

<script src="js/supabase-client.js"></script>
<script src="js/policies.js"></script>
<script src="js/app.js"></script>
<script>
(async function () {
  const auth = await requireAuth('weekly-meeting.html');
  if (!auth) return;
  const { user, site } = auth;

  let meetings = [];
  let editingId = null;
  let members = [];
  let meetingTasks = {};          // meeting id → its tasks
  let newTasks = [];              // action items typed in the open window

  const TASK_STATUS = { todo: 'לביצוע', in_progress: 'בתהליך', done: 'הושלם' };
  async function loadMembers() {
    const { data } = await sb.from('profile_sites').select('profiles(id, full_name, username)').eq('site_id', site.id);
    const seen = new Map();
    (data || []).forEach(r => { if (r.profiles) seen.set(r.profiles.id, r.profiles); });
    members = [...seen.values()];
  }
  async function loadMeetingTasks() {
    const { data } = await sb.from('tasks').select('id, title, status, due_date, assignee_id, meeting_id')
      .eq('site_id', site.id).not('meeting_id', 'is', null);
    meetingTasks = {};
    (data || []).forEach(t => { (meetingTasks[t.meeting_id] ||= []).push(t); });
  }
  const memberName = id => { const m = members.find(x => x.id === id); return m ? (m.full_name || m.username) : ''; };

  // What the meeting should go over: failed checks not fixed yet, extra-work claims waiting
  // for a decision, and overdue tasks.
  async function renderOpenItems() {
    const host = document.getElementById('meetingOpenItems');
    const today = new Date().toISOString().slice(0, 10);
    const [{ data: defects }, { data: xw }, { data: late }] = await Promise.all([
      sb.from('quality_controls').select('id, stage, subject, control_date, severity, planned_close_date').eq('site_id', site.id)
        .eq('result', 'לא תקין').is('closed_date', null).order('control_date', { ascending: true }),
      sb.from('exceptions').select('id, description, direction, party_name, claimed_amount, submitted_date').eq('site_id', site.id)
        .in('status', ['הוגש', 'בבדיקה']).order('submitted_date', { ascending: true }),
      sb.from('tasks').select('id, title, due_date, status').eq('site_id', site.id).neq('status', 'done').lt('due_date', today)
        .order('due_date', { ascending: true }),
    ]);
    const lines = [
      ...(defects || []).map(q => `<li><a href="${q.stage === 'preliminary' ? 'qc-preliminary' : 'qc-inprocess'}.html?open=${q.id}">ליקוי בבקרה ל"${esc(q.subject)}"${q.severity ? ' (חומרה ' + q.severity + ')' : ''}</a>${q.planned_close_date && q.planned_close_date < today ? ' <span class="ncr-late">באיחור</span>' : ''}</li>`),
      ...(xw || []).map(x => `<li><a href="exceptions.html?open=${x.id}">חריג ${esc(x.direction || '')}${x.party_name ? ' מול ' + esc(x.party_name) : ''}: ${esc(String(x.description || '').slice(0, 60))}</a>${x.claimed_amount ? ' · ' + esc(fmtNum(x.claimed_amount, 0)) + ' ₪' : ''} <span class="xw-sub-inline">ממתין להחלטה</span></li>`),
      ...(late || []).map(t => `<li><a href="tasks.html">משימה באיחור: ${esc(t.title)}</a> <span class="ncr-late">מ-${esc(fmtDate(t.due_date))}</span></li>`),
    ];
    host.innerHTML = lines.length
      ? `<label>נושאים פתוחים לדיון (נאסף אוטומטית)</label><ul class="mt-open">${lines.join('')}</ul>`
      : '<label>נושאים פתוחים לדיון</label><div class="field-hint" style="display:block">אין ליקויים פתוחים, אין חריגים שממתינים להחלטה ואין משימות באיחור.</div>';
  }

  function renderMeetingTasks() {
    const host = document.getElementById('meetingTasks');
    const existing = (editingId && meetingTasks[editingId]) || [];
    const opts = sel => '<option value="">מי?</option>' + members.map(m => `<option value="${m.id}"${m.id === sel ? ' selected' : ''}>${esc(m.full_name || m.username)}</option>`).join('');
    host.innerHTML = existing.map(t => `<div class="mt-row saved"><span class="mt-title">${esc(t.title)}</span>
        <span class="mt-meta">${esc(memberName(t.assignee_id) || '—')} · ${t.due_date ? esc(fmtDate(t.due_date)) : 'ללא תאריך'} · ${TASK_STATUS[t.status] || t.status}</span></div>`).join('')
      + newTasks.map((t, i) => `<div class="mt-row">
        <input type="text" placeholder="מה צריך לעשות" value="${esc(t.title)}" data-i="${i}" data-k="title">
        <select data-i="${i}" data-k="assignee_id">${opts(t.assignee_id)}</select>
        <input type="date" value="${esc(t.due_date || '')}" data-i="${i}" data-k="due_date">
        <button type="button" class="icon-btn" data-rm="${i}" aria-label="הסרה">${uiIcon('x', 14)}</button></div>`).join('');
    host.querySelectorAll('[data-k]').forEach(el => el.addEventListener('input', () => { newTasks[+el.dataset.i][el.dataset.k] = el.value || null; }));
    host.querySelectorAll('[data-rm]').forEach(b => b.addEventListener('click', () => { newTasks.splice(+b.dataset.rm, 1); renderMeetingTasks(); }));
  }
  document.getElementById('addMeetingTask').addEventListener('click', () => { newTasks.push({ title: '', assignee_id: null, due_date: null }); renderMeetingTasks(); });

  async function loadMeetings() {
    const { data, error } = await sb.from('weekly_meetings')
      .select('*').eq('site_id', site.id)
      .order('meeting_date', { ascending: false }).order('created_at', { ascending: false });
    if (error) { toast('שגיאה: ' + error.message, 'error'); return; }
    meetings = data || [];
    await loadMeetingTasks();
    renderList();
  }

  function renderList() {
    const host = document.getElementById('meetingsList');
    if (!meetings.length) { host.innerHTML = '<p class="empty-state">אין סיכומי ישיבות עדיין</p>'; return; }
    host.innerHTML = `<div class="attach-list">${meetings.map(m => `
      <div class="attach-item" style="align-items:flex-start;flex-direction:column;gap:6px;">
        <div style="display:flex;justify-content:space-between;width:100%;align-items:flex-start;gap:8px;">
          <div>
            <strong style="font-size:14px;">${esc(fmtDate(m.meeting_date))}</strong>
            ${m.attendees ? `<span style="color:var(--steel);font-size:12px;"> · ${esc(m.attendees)}</span>` : ''}
            ${(meetingTasks[m.id] || []).length ? `<span class="mt-badge">${meetingTasks[m.id].length} משימות · ${meetingTasks[m.id].filter(t => t.status !== 'done').length} פתוחות</span>` : ''}
          </div>
          <div style="display:flex;gap:4px;">
            <button type="button" class="icon-btn" data-edit="${m.id}" title="עריכה" aria-label="עריכה">${uiIcon('pencil')}</button>
            <button type="button" class="icon-btn danger" data-del="${m.id}" title="מחיקה" aria-label="מחיקה">${uiIcon('trash')}</button>
          </div>
        </div>
        <div style="font-size:13.5px;color:var(--ink);white-space:pre-wrap;line-height:1.5;">${esc(m.summary)}</div>
      </div>
    `).join('')}</div>`;

    host.querySelectorAll('[data-edit]').forEach(b => b.addEventListener('click', () => openModal(meetings.find(m => m.id === b.dataset.edit))));
    host.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', () => deleteMeeting(b.dataset.del)));
  }

  function openModal(m) {
    editingId = m ? m.id : null;
    const form = document.getElementById('recordForm');
    form.reset();
    hideMsg(document.getElementById('formMsg'));
    document.getElementById('modalTitle').textContent = m ? 'עריכת סיכום ישיבה' : 'סיכום ישיבה חדש';
    document.getElementById('deleteBtn').style.display = m ? 'inline-flex' : 'none';
    form.meeting_date.value = m ? m.meeting_date : new Date().toISOString().slice(0, 10);
    if (m) {
      form.attendees.value = m.attendees || '';
      form.summary.value = m.summary || '';
    }
    newTasks = [];
    renderMeetingTasks();
    renderOpenItems();
    document.getElementById('modalBackdrop').classList.add('open');
  }
  function closeModal() { document.getElementById('modalBackdrop').classList.remove('open'); }

  document.getElementById('addBtn').addEventListener('click', () => openModal(null));
  document.getElementById('closeModalBtn').addEventListener('click', closeModal);
  document.getElementById('cancelBtn').addEventListener('click', closeModal);
  document.getElementById('modalBackdrop').addEventListener('click', e => { if (e.target.id === 'modalBackdrop') closeModal(); });

  document.getElementById('recordForm').addEventListener('submit', async e => {
    e.preventDefault();
    const msgEl = document.getElementById('formMsg');
    hideMsg(msgEl);
    const fd = new FormData(e.target);
    const payload = {
      meeting_date: fd.get('meeting_date'),
      attendees: fd.get('attendees') || null,
      summary: fd.get('summary'),
    };

    const submitBtn = e.target.querySelector('[type=submit]');
    submitBtn.disabled = true;
    try {
      let meetingId = editingId;
      if (editingId) {
        payload.updated_by = user.id;
        payload.updated_at = new Date().toISOString();
        const { error } = await sb.from('weekly_meetings').update(payload).eq('id', editingId);
        if (error) throw error;
      } else {
        payload.site_id = site.id;
        payload.created_by = user.id;
        const { data: saved, error } = await sb.from('weekly_meetings').insert(payload).select('id').single();
        if (error) throw error;
        meetingId = saved.id;
        editingId = meetingId;       // a retry must not save the meeting twice
      }
      // the action items become tasks, linked to this meeting
      const todo = newTasks.filter(t => t.title && t.title.trim());
      if (todo.length) {
        const { count } = await sb.from('tasks').select('id', { count: 'exact', head: true }).eq('site_id', site.id).eq('status', 'todo');
        const rows = todo.map((t, i) => ({
          site_id: site.id, title: t.title.trim(), status: 'todo', due_date: t.due_date || null, assignee_id: t.assignee_id || null,
          sort_order: (count || 0) + i, meeting_id: meetingId, description: `מסיכום הישיבה מ-${fmtDate(payload.meeting_date)}`, created_by: user.id,
        }));
        const { error: tErr } = await sb.from('tasks').insert(rows);
        if (tErr) throw new Error('הסיכום נשמר, אבל המשימות לא: ' + tErr.message);
        newTasks = [];
      }
      toast(editingId && !todo.length ? 'הסיכום עודכן' : `הסיכום נשמר${todo.length ? ` · נפתחו ${todo.length} משימות` : ''}`, 'success');
      closeModal();
      await loadMeetings();
    } catch (err) {
      showMsg(msgEl, 'שגיאה: ' + err.message, 'error');
    } finally {
      submitBtn.disabled = false;
    }
  });

  document.getElementById('deleteBtn').addEventListener('click', async () => {
    if (!editingId || !confirm('למחוק את הסיכום הזה?')) return;
    const { error } = await sb.from('weekly_meetings').delete().eq('id', editingId);
    if (error) { toast('שגיאה: ' + error.message, 'error'); return; }
    toast('הסיכום נמחק', 'success');
    closeModal();
    await loadMeetings();
  });

  async function deleteMeeting(id) {
    if (!confirm('למחוק את הסיכום הזה?')) return;
    const { error } = await sb.from('weekly_meetings').delete().eq('id', id);
    if (error) { toast('שגיאה: ' + error.message, 'error'); return; }
    toast('הסיכום נמחק', 'success');
    await loadMeetings();
  }

  async function exportMeetings(format) {
    if (!meetings.length) { toast('אין סיכומים לייצוא', 'error'); return; }
    const columns = [
      { key: 'meeting_date', label: 'תאריך', type: 'date' },
      { key: 'attendees', label: 'משתתפים', type: 'text' },
      { key: 'summary', label: 'סיכום', type: 'text' },
    ];
    await (format === 'xlsx' ? sgpExportExcel : sgpExportPdf)({
      title: 'סיכומי ישיבות שבועיות',
      ico: 'meetings',
      layout: 'cards',
      cardTitleKey: 'meeting_date',
      columns,
      rows: meetings,
      siteNames: [site.name],
      periodText: null,
    });
  }
  document.getElementById('exportAllBtn').addEventListener('click', () => exportMeetings('pdf'));
  document.getElementById('exportAllXlsxBtn').addEventListener('click', () => exportMeetings('xlsx'));

  await loadMembers();
  await loadMeetings();
})();
</script>
</body>
</html>
