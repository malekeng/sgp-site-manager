<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>הזמנות ברזל | TADOK</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="application-name" content="TADOK">
<meta name="apple-mobile-web-app-title" content="TADOK">
<meta name="theme-color" content="#0E1A20">
<meta property="og:type" content="website">
<meta property="og:site_name" content="TADOK">
<meta property="og:title" content="TADOK — תיעוד, בקרת איכות ושליטה באתר הבנייה">
<meta property="og:description" content="פלטפורמה לניהול אתר בנייה: יציקות, ברזל, מסמכים, בקרת איכות ודוחות.">
<meta property="og:image" content="https://tadok.vercel.app/brand/og-image.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:locale" content="he_IL">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="css/styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="js/pdf-report.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<script src="js/ocr.js"></script>
<style>
/* the hidden "פעולות" header (.sr-only) is position:absolute; without a positioned table it escapes
   the scrolling .table-wrap and widens the whole page on a phone */
.items-table, .orders-table { position: relative; }
.order-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.order-head h2 { margin: 0; }
.unit-totals { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
.unit-pill {
  background: var(--bg); border: 1px solid var(--border); border-radius: 999px;
  padding: 4px 12px; font-size: 12.5px; font-weight: 700; color: var(--navy);
  font-variant-numeric: tabular-nums;
}
.orders-table tr.is-overdue td:first-child { box-shadow: inset -3px 0 0 var(--danger); }
.orders-table tbody tr[data-open] { cursor: pointer; }
.orders-table td:first-child, .items-table td.num-cell { white-space: nowrap; }
.contact-row { display: grid; grid-template-columns: 1fr 1fr 1fr 32px; gap: 8px; align-items: center; margin-bottom: 6px; }
.contact-row input { padding: 8px 10px; border: 2px solid var(--border); border-radius: var(--radius-sm); font: inherit; min-width: 0; }
@media (max-width: 560px) { .contact-row { grid-template-columns: 1fr 1fr 32px; } .contact-row input[data-k="role"] { grid-column: 1 / -2; } }
.orderer-line { font-size: 13.5px; color: var(--navy); font-weight: 600; padding: 9px 0; }
.locked-note { font-size: 12.5px; color: var(--steel); font-weight: 600; }
.shape-thumb { display: block; width: 150px; height: 60px; }
.cell-note { font-size: 11.5px; font-weight: 600; color: var(--steel); margin-top: 2px; white-space: nowrap; }
.shape-thumb svg { width: 100%; height: 100%; }
.approx-badge {
  font-size: 10.5px; font-weight: 800; padding: 2px 8px; border-radius: 999px;
  background: rgba(255,157,66,0.16); color: #b5651d; white-space: nowrap;
}
.modal.modal-wide { max-width: 880px; }
/* ===== the add-items window: kind switch, shape strip, drawing + card, tray ===== */
.modal.item-win { max-width: 1040px; padding: 22px 24px 18px; }
.iw-head { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding-left: 34px; margin-bottom: 12px; }
.iw-head h3 { margin: 0; }
.iw-kinds { display: inline-flex; gap: 2px; padding: 3px; background: var(--bg); border-radius: 999px; }
.iw-kinds button { border: 0; background: none; font: inherit; font-size: 13px; font-weight: 700; color: var(--steel); padding: 6px 16px; border-radius: 999px; cursor: pointer; }
.iw-kinds button[aria-selected="true"] { background: var(--sheet); color: var(--navy); box-shadow: var(--shadow); }
.iw-strip { display: flex; gap: 8px; align-items: center; overflow-x: auto; padding: 2px 2px 10px; }
.iw-shape {
  flex: 0 0 auto; width: 60px; height: 44px; display: flex; align-items: center; justify-content: center;
  background: var(--sheet); border: 1.5px solid var(--border); border-radius: var(--radius-sm); cursor: pointer; color: var(--navy);
}
.iw-shape svg { width: 46px; height: 26px; }
.iw-shape:hover { border-color: rgba(34, 216, 107, 0.5); }
.iw-shape.is-on { border-color: var(--green); background: var(--green-soft); }
.iw-all { flex: 0 0 auto; }
.iw-body { display: grid; grid-template-columns: minmax(0, 1fr) 290px; gap: 14px; }
.iw-body-form { grid-template-columns: minmax(0, 1fr); }
.iw-stage { position: relative; min-height: 340px; background: var(--bg); border-radius: var(--radius-sm); overflow: hidden; }
.iw-svg { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
.iw-stage.is-free .iw-svg { cursor: crosshair; background: var(--sheet); }
.iw-svg .iw-bar { fill: none; stroke: var(--navy); stroke-width: 4; stroke-linejoin: round; stroke-linecap: round; }
.iw-svg .iw-hl { stroke: var(--green); stroke-width: 8; stroke-linecap: round; opacity: 0.55; }
.iw-svg .iw-hit { stroke: transparent; stroke-width: 26; cursor: grab; pointer-events: stroke; }
.iw-svg .iw-hit:hover { stroke: rgba(34, 216, 107, 0.16); }
.iw-svg .iw-letter-svg { font-size: 12px; font-weight: 800; fill: var(--steel-light); text-anchor: middle; dominant-baseline: middle; }
.iw-svg .iw-grid { stroke: #E6EAF0; }
.iw-svg .iw-dot { fill: var(--green); }
.iw-box {
  position: absolute; transform: translate(-50%, -50%); width: 64px; padding: 5px 4px; text-align: center;
  font: inherit; font-size: 14px; font-weight: 800; color: var(--navy); font-variant-numeric: tabular-nums;
  background: var(--sheet); border: 1.5px solid var(--border); border-radius: 10px; box-shadow: var(--shadow);
}
.iw-box:focus { outline: none; border-color: var(--green); box-shadow: 0 0 0 4px rgba(34, 216, 107, 0.18); }
.iw-box.is-bad { border-color: var(--danger); }
.iw-badge {
  position: absolute; top: 10px; z-index: 2; display: inline-flex; align-items: center; gap: 6px;
  font: inherit; font-size: 12px; font-weight: 700; color: var(--steel);
  background: var(--sheet); border: 1px solid var(--border); border-radius: 999px; padding: 4px 12px;
}
.iw-badge:empty { display: none; }
.iw-badge-len { right: 10px; font-variant-numeric: tabular-nums; }
.iw-badge-sym, .iw-badge-clear { left: 10px; cursor: pointer; }
.iw-gallery { position: absolute; inset: 0; z-index: 3; background: var(--sheet); overflow-y: auto; padding: 0 14px 12px; }
.iw-gal-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; position: sticky; top: 0; z-index: 1; background: var(--sheet); padding: 12px 0 8px; }
.iw-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.iw-chip {
  display: inline-flex; align-items: center; gap: 4px; padding: 4px 12px; cursor: pointer;
  font: inherit; font-size: 12.5px; font-weight: 700; color: var(--navy);
  background: var(--sheet); border: 1.5px solid var(--border); border-radius: 999px;
}
.iw-chip.is-on { border-color: var(--green); background: var(--green-soft); }
.iw-gal-group + .iw-gal-group { margin-top: 10px; }
.iw-gal-label { font-size: 11.5px; font-weight: 700; color: var(--steel); margin-bottom: 6px; }
.iw-gal-row { display: flex; flex-wrap: wrap; gap: 8px; }
.iw-gal-btn {
  display: flex; flex-direction: column; align-items: center; gap: 2px; width: 104px; padding: 6px; cursor: pointer;
  font: inherit; font-size: 11.5px; font-weight: 600; color: var(--navy);
  background: var(--sheet); border: 1.5px solid var(--border); border-radius: var(--radius-sm);
}
.iw-gal-btn:hover { border-color: rgba(34, 216, 107, 0.5); }
.iw-gal-btn.is-on { border-color: var(--green); background: var(--green-soft); }
.iw-gal-btn svg { width: 84px; height: 40px; }
.iw-card { display: flex; flex-direction: column; min-width: 0; padding: 14px; border: 1.5px solid var(--border); border-radius: var(--radius-sm); }
.iw-card .field input, .iw-card .field select { padding: 7px 10px; }
.iw-sec { display: flex; justify-content: space-between; font-size: 12.5px; font-weight: 800; color: var(--navy); margin-bottom: 8px; }
.iw-sec span + span { font-weight: 700; color: var(--steel-light); }
.iw-lrow { display: grid; grid-template-columns: 18px minmax(0, 1fr) 40px; align-items: center; gap: 4px 8px; margin-bottom: 5px; }
.iw-lrow input { text-align: center; font-weight: 700; }
.iw-letter { font-weight: 800; color: var(--steel); text-align: center; }
.iw-ang { font-size: 12px; color: var(--steel-light); text-align: center; font-variant-numeric: tabular-nums; }
.iw-row { display: grid; grid-template-columns: minmax(0, 1fr) 128px; align-items: center; gap: 4px 10px; margin-bottom: 6px; }
.iw-row .field-error-msg, .iw-lrow .field-error-msg { grid-column: 1 / -1; margin-top: 0; }
.iw-sep { border-top: 1px solid var(--border); margin: 6px 0 12px; }
.iw-foot { margin-top: auto; padding-top: 12px; border-top: 1px solid var(--border); }
.iw-body-form .iw-foot { margin-top: 16px; }
.iw-totals { background: var(--green-soft); border-radius: var(--radius-sm); padding: 8px 12px; margin-bottom: 10px; }
.iw-tot { display: flex; justify-content: space-between; gap: 8px; font-size: 12.5px; color: var(--steel); font-variant-numeric: tabular-nums; }
.iw-tot-sum { margin-top: 4px; align-items: baseline; color: var(--navy); font-weight: 700; }
.iw-tot-sum b { font-size: 18px; font-weight: 800; color: var(--green-deep); white-space: nowrap; }
.iw-tot-hint { font-size: 12.5px; color: var(--steel); }
.iw-actions { display: flex; gap: 8px; }
.iw-actions .btn-primary { flex: 1; justify-content: center; }
.iw-tray { display: flex; align-items: center; gap: 12px; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border); }
.iw-tray-count { font-size: 12.5px; font-weight: 700; color: var(--steel); white-space: nowrap; }
.iw-items { display: flex; gap: 6px; overflow-x: auto; flex: 1; min-width: 0; padding: 2px; }
.iw-item {
  flex: 0 0 auto; display: inline-flex; align-items: center; gap: 6px; padding: 3px; padding-inline: 10px 4px;
  font-size: 12px; font-weight: 700; color: var(--navy); font-variant-numeric: tabular-nums;
  background: var(--sheet); border: 1.5px solid var(--border); border-radius: 999px;
}
.iw-item svg { width: 40px; height: 22px; }
.iw-item-kind { font-size: 11px; color: var(--steel); }
.iw-item-del { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; border: 0; border-radius: 50%; background: var(--bg); color: var(--steel); cursor: pointer; }
.iw-item-del:hover { background: rgba(255, 71, 87, 0.12); color: var(--danger); }
.iw-seg { display: inline-flex; gap: 2px; padding: 3px; background: var(--bg); border-radius: 999px; flex-wrap: wrap; }
.iw-seg button { border: 0; background: none; font: inherit; font-size: 12.5px; font-weight: 700; color: var(--steel); padding: 5px 14px; border-radius: 999px; cursor: pointer; }
.iw-seg button[aria-pressed="true"] { background: var(--sheet); color: var(--navy); box-shadow: var(--shadow); }
.iw-row .iw-seg { justify-self: end; }
.iw-typebar { margin: 2px 0 12px; }
.iw-card-narrow { max-width: 460px; }
.iw-svg .iw-ring { fill: none; stroke: var(--navy); stroke-width: 2.5; }
.iw-svg .iw-mesh { stroke-linecap: round; }
.iw-svg .iw-mesh-x { stroke: var(--navy); }
.iw-svg .iw-mesh-y { stroke: var(--green-deep); }
.iw-svg .iw-mesh-empty { fill: none; stroke: var(--steel-light); stroke-width: 1.5; stroke-dasharray: 6 5; }
.iw-svg .iw-dim { stroke: var(--steel-light); stroke-width: 1; }
.iw-svg [data-mhit="x"] { cursor: ew-resize; }
.iw-svg [data-mhit="y"] { cursor: ns-resize; }
select.iw-box { width: 76px; padding: 4px 2px; cursor: pointer; }
.iw-box-kx { border-color: var(--navy); }
.iw-box-ky { border-color: var(--green-deep); }
.iw-key { display: inline-block; width: 12px; height: 4px; border-radius: 2px; vertical-align: middle; margin-inline-end: 6px; }
.iw-key-x { background: var(--navy); }
.iw-key-y { background: var(--green-deep); }
.iw-bundle { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--steel); margin: 0 0 10px; }
.iw-bundle:empty { display: none; }
.iw-bundle b { color: var(--navy); }
.iw-bundle .btn { flex: 0 0 auto; }
@media (max-width: 760px) {
  .modal.item-win { padding: 18px 14px 14px; }
  .iw-card-narrow { max-width: none; }
  .iw-body { grid-template-columns: minmax(0, 1fr); }
  .iw-stage { min-height: 270px; }
  .iw-tray { flex-wrap: wrap; }
  .iw-items { order: 3; flex-basis: 100%; }
}
.check-row { display: flex; flex-wrap: wrap; gap: 14px; }
.check-line { display: inline-flex; align-items: center; gap: 6px; font-size: 13.5px; font-weight: 600; color: var(--navy); }
.ocr-zone { border: 1.5px dashed var(--border); border-radius: 10px; padding: 22px; text-align: center; cursor: pointer; margin-bottom: 16px; }
.ocr-zone:hover, .ocr-zone.dragover { border-color: var(--green); background: rgba(34, 216, 107,0.06); }
.ocr-progress { display: none; align-items: center; gap: 10px; margin-bottom: 16px; font-size: 13px; color: var(--steel); }
.ocr-progress.show { display: flex; }
.supplied { display: flex; align-items: center; gap: 6px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.supplied-bar { width: 46px; height: 6px; border-radius: 999px; background: var(--bg); overflow: hidden; }
.supplied-bar > i { display: block; height: 100%; background: var(--green); }
.rc-read { background: var(--bg); border-radius: var(--radius-sm); padding: 10px 14px; margin-bottom: 14px; font-size: 13px; color: var(--navy); }
.rc-read b { font-weight: 800; }
.rc-lines input[type=number], .rc-lines input[inputmode] { width: 84px; padding: 7px 8px; border: 2px solid var(--border); border-radius: var(--radius-sm); font: inherit; }
.rc-lines td { vertical-align: middle; }
.items-table.rc-lines { min-width: 480px; }
.rc-lines input[type=checkbox] { width: 20px; height: 20px; }
.receipt-row .di-checks { margin-top: 6px; }
.summary-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
.summary-grid table { min-width: 0; }
.summary-grid td.num-cell, .summary-grid th.num-cell { text-align: left; }
</style>
</head>
<body>

<header class="app-header" id="app-header"></header>

<main class="page">
  <h1 class="page-title" id="pageTitle">הזמנת ברזל</h1>
  <div class="stats-row" id="statsRow"></div>
  <!-- one order; the site's orders are listed in the ברזל page (rebar.html) -->

  <!-- one order -->
  <div id="editorWrap" style="display:none;">
    <div class="card">
      <div class="card-header">
        <div class="order-head"><h2 id="edTitle">הזמנה חדשה</h2><span id="edStatus"></span></div>
        <div class="header-actions" id="edActions"></div>
      </div>
      <div id="edMsg" class="msg"></div>
      <form class="form-grid" id="headerForm" autocomplete="off">
        <div class="field"><label for="f-name">שם ההזמנה *</label><input id="f-name" maxlength="200" placeholder="לדוגמה: ברזל רצפה קומה 2"></div>
        <div class="field"><label for="f-order_no">מס' הזמנה *</label><input id="f-order_no" maxlength="40"></div>
        <div class="field"><label for="f-supplier">ספק</label><input id="f-supplier" list="supplierList" maxlength="120"><datalist id="supplierList"></datalist></div>
        <div class="field"><label for="f-required_date">תאריך אספקה נדרש</label><input id="f-required_date" type="date"></div>
        <div class="field full"><label for="f-delivery_address">כתובת למשלוח</label><input id="f-delivery_address" maxlength="200"></div>
        <div class="field full"><label for="f-driver_notes">הערות לנהג</label><textarea id="f-driver_notes" rows="2" maxlength="500"></textarea></div>
        <div class="field"><label for="f-waste_pct">פחת (%)</label><input id="f-waste_pct" inputmode="decimal"></div>
        <div class="field"><label>מזמין</label><div class="orderer-line" id="ordererLine"></div></div>
        <div class="field full">
          <label>אנשי קשר בשטח</label>
          <div id="contactsList"></div>
          <div><button type="button" class="btn btn-outline btn-sm" id="addContactBtn">+ איש קשר</button></div>
        </div>
      </form>
    </div>

    <div id="sectionsHost"></div>
    <div id="receiptsHost"></div>
    <div id="summaryHost"></div>
  </div>
</main>

<!-- close an order -->
<div class="modal-backdrop" id="closeBackdrop">
  <div class="modal">
    <button class="icon-btn modal-close" id="closeX" aria-label="סגירה"><svg class="ui-ico ui-ico-x" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
    <h3>סגירת הזמנה</h3>
    <div id="closeMsg" class="msg"></div>
    <div class="field full">
      <label for="closeReason">סיבת סגירה *</label>
      <textarea id="closeReason" rows="3" maxlength="500" placeholder="לדוגמה: הספק לא יספק את היתרה"></textarea>
      <div class="field-hint">הזמנה סגורה לא מחכה עוד לאספקה, גם אם נשארו שורות שלא סופקו.</div>
    </div>
    <div class="modal-actions">
      <button type="button" class="btn btn-primary" id="closeConfirm">סגור הזמנה</button>
      <button type="button" class="btn btn-outline" id="closeCancel">ביטול</button>
    </div>
  </div>
</div>

<!-- receive a delivery -->
<div class="modal-backdrop" id="receiptBackdrop">
  <div class="modal modal-wide" id="receiptModal"></div>
</div>

<!-- add / edit a line (bar, mesh or pile) -->
<div class="modal-backdrop" id="itemBackdrop">
  <div class="modal" id="itemModal"></div>
</div>

<script src="js/supabase-client.js"></script>
<script src="js/policies.js"></script>
<script src="js/app.js"></script>
<script src="js/rebar-calc.js"></script>
<script src="js/rebar-shapes.js"></script>
<script src="js/rebar-orders-core.js"></script>
<script src="js/rebar-receipts.js"></script>
<script src="js/rebar-pdf.js"></script>
<script src="js/rebar-orders.js"></script>
</body>
</html>
